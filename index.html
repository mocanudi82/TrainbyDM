 --bg:#eef3f1;--bg0:#eef3f1;--dm:0%;--card:#ffffff;--ink:#222a2a;--muted:#5d6f6f;--line:#222a2a;--shadow:#222a2a;
 --accent:#ec4624;--accent-t:#c93a1c;--accent-ink:#fbf3e1;--accent-soft:#f6cdbf;--ok:#222a2a;--ok-soft:#d3ecec;--warn:#8a5a00;--warn-soft:#f8de9a;--bad:#b8321c;--bad-soft:#f6cdbf;
 --chip:#dfe9e6;--s1:#222a2a;--s2:#ec4624;--s3:#f39120;--s4:#f1e6cf;--c-or:#ec4624;--c-te:#222a2a;--c-la:#f39120;--c-ye:#f39120;--c-na:#151515;
 --fh:"Oswald","Arial Narrow",Impact,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2e3a3a;--bg0:#2e3a3a;--dm:0%;--card:#3a4848;--ink:#e2dac2;--muted:#aebfbc;--line:#e2dac2;--shadow:#e2dac2;--accent-t:#ff8a6a;--ok:#e2dac2;--ok-soft:#2f5a5a;--chip:#465757;--warn:#f39120;--warn-soft:#5a4416;--bad:#ff9a84;--bad-soft:#5c2c22;--s1:#e2dac2;--s4:#4fbbbc}}
:root[data-theme="dark"]{--bg:#2e3a3a;--bg0:#2e3a3a;--dm:0%;--card:#3a4848;--ink:#e2dac2;--muted:#aebfbc;--line:#e2dac2;--shadow:#e2dac2;--accent-t:#ff8a6a;--ok:#e2dac2;--ok-soft:#2f5a5a;--chip:#465757;--warn:#f39120;--warn-soft:#5a4416;--bad:#ff9a84;--bad-soft:#5c2c22;--s1:#e2dac2;--s4:#4fbbbc}
body{line-height:1.3;font-size:15px}
h1,h2,.sess-title,.sec,.tab,.wk b,.btn,.links button,.links a,.low,.skip,.opt,.minih,.pbar label,.tmr .l{font-family:var(--fh);letter-spacing:.6px;text-transform:uppercase}
h1{font-size:30px;line-height:.95;font-weight:700;color:var(--ink);white-space:normal;letter-spacing:.5px}
h1::before{content:""}
.sub{display:inline-block;margin-top:5px;background:var(--red);color:#fbf3e1;font-family:var(--fh);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 8px}
header.top::after{height:10px;border-radius:0;background:linear-gradient(90deg,var(--red) 0 33%,var(--yel) 33% 66%,var(--brn) 66%)}
.iconbtn{background:var(--brn);color:var(--yel);border:0;border-radius:0}
.wk{border-radius:0;border:2px solid var(--ink);background:var(--card)}
.wk[data-w="0"],.wk[data-w="3"]{--tc:var(--red)}.wk[data-w="1"],.wk[data-w="4"]{--tc:var(--yel)}.wk[data-w="2"]{--tc:#e9a58f}
.wk,.tab{background:color-mix(in srgb,var(--tc) 30%,var(--card))}
.wk.on,.tab.on{background:var(--tc);color:#222a2a}
.tab{border-radius:0;border:2px solid var(--ink)}
.tab[data-s="D1"]{--tc:var(--red)}.tab[data-s="D2"]{--tc:var(--yel)}.tab[data-s="D3"]{--tc:#e9a58f}.tab[data-s="D4"]{--tc:#d9c79f}
.tab.on{color:#fbf3e1}.tab[data-s="D2"].on,.tab[data-s="D4"].on,.tab[data-s="D3"].on{color:#222a2a}
.bar{height:8px;border-radius:0;border:2px solid var(--ink);background:var(--card)}.bar i{background:var(--red)}
.sess-title{font-size:26px;line-height:1;font-weight:700;color:var(--ink);letter-spacing:.4px;margin:16px 0 4px;text-wrap:balance}
.sess-title::after{content:"";display:block;height:5px;width:64px;background:var(--red);margin-top:7px}
.sess-meta{font-size:12.5px;border-left:4px solid var(--yel);padding-left:8px}
.blk{background:none;border:0;padding:0;margin:20px 0 0;border-radius:0}
.blk .sec{margin:0 0 6px;display:flex;align-items:center}
.blk .sec>span:first-child{background:var(--brn);color:var(--yel);padding:5px 10px;border-radius:0;font-size:14px;line-height:1.15;letter-spacing:.8px}
.blk.alt .sec>span:first-child{background:var(--red);color:#fbf3e1}
.blk .sec .cnt{font-family:var(--fm);color:var(--ink)}
.ex,.card{border-radius:0;border:2px solid var(--ink);background:var(--card);box-shadow:none}
.blk .ex{background:var(--card)}
.ex .nm{font-family:var(--fh);text-transform:uppercase;font-size:18px;letter-spacing:.3px;font-weight:700;line-height:1.1}
.num,.blk .num{border-radius:0;background:var(--yel);color:#222a2a;border:0}
.blk.alt .num{background:var(--red);color:#fbf3e1}
.spec b{font-size:19px}
.set{border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.set.on{border-color:var(--blk);color:#fbf3e1;background:radial-gradient(circle,var(--red) 0 27%,transparent 28%),repeating-radial-gradient(circle,#151515 0 2px,#2e2e2e 2px 3px)}
.ex.done{background:var(--ok-soft)!important}
.links button,.links a{border-radius:0;background:var(--chip);color:var(--ink);font-size:13px;padding:4px 10px}
.links [data-plt]{background:var(--chip)}.links [data-note]{background:var(--yel)}.links [data-edit]{background:var(--chip)}.links [data-swap]{background:var(--chip)}.links a{background:var(--chip)}
.links [data-tm]{background:var(--red);color:#fbf3e1}
.btn{border-radius:0;background:var(--brn);color:var(--yel);border:0}
.btn.alt{background:var(--chip);color:var(--ink)}
.low{border-radius:0;background:var(--yel);color:#222a2a}.low.hot{background:var(--red);color:#fbf3e1}
.opt{border-radius:0;background:var(--yel);color:#222a2a}
.kg,.tjh,.tjt input,.field input,textarea{border-radius:0;border:2px solid var(--ink);background:var(--card)}
.tjt{background:var(--warn-soft);border-radius:0}
.note{background:var(--chip);border-radius:0;border-left:4px solid var(--red)}
.pbar{background:var(--brn)!important;border-top:0}
.pbar label{color:var(--yel)}
.pbar button,.pbar button[data-p]{background:var(--yel)!important;color:#222a2a;border:0;border-radius:0;aspect-ratio:auto;height:36px}
.pbar button.on,.pbar button.on[data-p]{background:var(--red)!important;color:#fbf3e1}
.tmr{background:var(--blk);color:var(--yel);border:2px solid var(--red);border-radius:0}
.tmr button{border-radius:0;background:var(--yel);color:#222a2a}
.sclk button{background:var(--red);color:#fbf3e1;border-radius:0}
.banner{border-radius:0;border:2px solid var(--red)}
.mq{background:var(--warn-soft);border-color:var(--ink)}
.mq .mrow button{border-radius:0;background:var(--yel)}
.panel{border-radius:0;border-top:6px solid var(--red)}
.card h2{border-bottom:4px solid var(--red);font-size:20px}
.swit.on{background:var(--yel)}

/* ===== B2 refinements ===== */
.blk{border:3px solid var(--ink);padding:0 8px 6px;margin:22px 0 0;background:color-mix(in srgb,var(--yel) 14%,var(--bg))}
.blk.alt{background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.blk .sec{margin:0 -8px 8px;gap:0}
.blk .sec>span:first-child{flex:1;padding:6px 10px}
.blk .sec .cnt{background:var(--ink);color:var(--yel);padding:0 10px;align-self:stretch;display:flex;align-items:center;margin-left:0;font-size:13px}
.blk .ex{border-width:1px 1px 1px 8px}

.mast{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:8px;color:var(--ink)}
#main{counter-reset:trk}
.blk{counter-increment:trk}
.blk .sec>span:first-child::before{content:"Block " counter(trk,decimal-leading-zero);display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:1.4px;opacity:.8;margin-bottom:1px}
.spec b{display:inline-block;background:var(--yel);color:#222a2a;padding:0 9px;transform:rotate(-2deg);border:2px solid var(--ink);font-size:20px;line-height:1.25}
.spec{align-items:center;gap:8px 12px}
.ex{border-left:8px solid var(--bc,var(--red))}
.blk.alt .ex{border-left-color:var(--red)}.blk:not(.alt) .ex{border-left-color:var(--brn)}
.ex .nm{font-size:19px}
.sess-meta{font-family:var(--fm);font-size:11px;letter-spacing:.3px}
.sess-title{font-size:30px}
.bar{height:12px;position:relative;overflow:visible}.bar i{position:relative;background:repeating-linear-gradient(90deg,var(--red) 0 10px,#c93a1c 10px 12px)}
.bar i::after{content:"";position:absolute;right:-9px;top:-5px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--red) 0 28%,transparent 30%),repeating-radial-gradient(circle,#151515 0 1.5px,#2e2e2e 1.5px 2.5px);border:1px solid #151515}
.pbar button[data-p="0"],.pbar button[data-p="1"],.pbar button[data-p="2"],.pbar button[data-p="3"]{background:#f39120!important}
.pbar button[data-p="4"],.pbar button[data-p="5"]{background:#f39120!important}
.pbar button[data-p="6"],.pbar button[data-p="7"],.pbar button[data-p="8"],.pbar button[data-p="9"],.pbar button[data-p="10"]{background:#ec4624!important;color:#fbf3e1}
.pbar button.on,.pbar button.on[data-p]{outline:3px solid #fbf3e1;outline-offset:-3px;background:#151515!important;color:#f39120}
.tmr{overflow:visible;padding-left:84px;min-height:92px}
.tmr::before{content:"";position:absolute;left:12px;top:50%;margin-top:-30px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#151515 0 4%,var(--red) 5% 26%,transparent 27%),repeating-radial-gradient(circle,#151515 0 2px,#2e2e2e 2px 3px);border:2px solid #444}
.tmr.go::before{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tmr .big{font-family:var(--fm);color:var(--yel)}
#finBtn{display:block;width:100%;background:var(--red);color:#fbf3e1;font-size:18px;padding:13px;margin:16px 0 6px;letter-spacing:1px;text-align:center}
#resetSess{display:block;width:100%;text-align:center}
.card h2::before{content:"★ ";color:var(--red)}
.hist details{border-bottom:2px solid var(--ink)}
.add .btn{background:var(--brn);color:var(--yel)}
.links{border-top:1px dashed var(--ink);padding-top:8px}
.links button,.links a{border:1px solid var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mast{border-color:var(--ink)}:root:not([data-theme="light"]) .spec b{color:#222a2a}}

/* ===== B3: disco title ===== */
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand h1{margin:0;line-height:.8;padding:0 14px 10px 0}
.ski{display:block;font-family:var(--fh);font-weight:700;font-size:68px;line-height:.8;letter-spacing:1px;color:var(--ink);
 text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 var(--brn)}
.bt{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.prep{font-family:var(--fh);font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);border-top:3px solid var(--red);border-bottom:3px solid var(--yel);padding:2px 0;line-height:1.1}
.bt .sub{margin:0;font-size:10.5px;padding:2px 6px;letter-spacing:.8px}
.iconbtn{width:32px;height:32px;font-size:16px}
.row{gap:6px}
.sess-title{font-size:19px;line-height:1.1;margin:14px 0 4px;letter-spacing:.5px}
.sess-title::after{height:4px;width:44px;margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{color:#f6ecd6;text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 #8a2f1e}}
:root[data-theme="dark"] .ski{color:#f6ecd6;text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 #8a2f1e}

.mast{align-items:center;padding:4px 0}
.mast .mt{display:flex;flex-direction:column;gap:2px}
.mast .mi{display:flex;gap:6px}
.mast .iconbtn{width:34px;height:34px}
.bt .sub{white-space:nowrap}
.brand{gap:14px}

/* ===== C: Iron / Aqua / Rust ===== */
:root{--aq:#4fbbbc;--cr:#e2dac2}
.sub{background:var(--aq);color:#222a2a}
header.top::after{background:linear-gradient(90deg,#ec4624 0 25%,#f39120 25% 50%,#4fbbbc 50% 75%,#222a2a 75%)}
.ski{text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #222a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{color:#e2dac2;text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #e2dac2}}
:root[data-theme="dark"] .ski{color:#e2dac2;text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #e2dac2}
.prep{border-top-color:#ec4624;border-bottom-color:#4fbbbc}
.wk[data-w="0"]{--tc:#4fbbbc}.wk[data-w="1"]{--tc:#f39120}.wk[data-w="2"]{--tc:#ec4624}.wk[data-w="3"]{--tc:#e2dac2}.wk[data-w="4"]{--tc:#4fbbbc}
.tab[data-s="D1"]{--tc:#ec4624}.tab[data-s="D2"]{--tc:#f39120}.tab[data-s="D3"]{--tc:#4fbbbc}.tab[data-s="D4"]{--tc:#e2dac2}
.wk.on,.tab.on{color:#222a2a}.tab[data-s="D1"].on{color:#fff}
.sess-title::after{background:#ec4624}
.sess-meta{border-left-color:#4fbbbc}
.blk{background:color-mix(in srgb,#f39120 12%,var(--bg))}
.blk.alt{background:color-mix(in srgb,#4fbbbc 16%,var(--bg))}
.blk .sec>span:first-child{background:#222a2a;color:#f39120}
.blk.alt .sec>span:first-child{background:#4fbbbc;color:#222a2a}
.blk .sec .cnt{background:#222a2a;color:#e2dac2}
.blk .num{background:#f39120;color:#222a2a}.blk.alt .num{background:#4fbbbc;color:#222a2a}
.blk .ex{border-left-color:#222a2a}.blk.alt .ex{border-left-color:#4fbbbc}
.spec b{background:#e2dac2;color:#222a2a}
.links [data-note]{background:#4fbbbc;color:#222a2a}.links [data-tm]{background:#ec4624;color:#fff}
.tjt{background:#e2dac2}.note{background:#e2dac2;border-left-color:#4fbbbc}
.low{background:#e2dac2;color:#222a2a}.low.hot{background:#ec4624;color:#fff}
.opt{background:#4fbbbc;color:#222a2a}
.pbar{background:#222a2a!important}
.pbar button[data-p="0"],.pbar button[data-p="1"],.pbar button[data-p="2"],.pbar button[data-p="3"]{background:#4fbbbc!important;color:#222a2a}
.pbar button[data-p="4"],.pbar button[data-p="5"]{background:#f39120!important;color:#222a2a}
.pbar button[data-p="6"],.pbar button[data-p="7"],.pbar button[data-p="8"],.pbar button[data-p="9"],.pbar button[data-p="10"]{background:#ec4624!important;color:#fff}
.pbar button.on,.pbar button.on[data-p]{background:#e2dac2!important;color:#222a2a;outline:3px solid #222a2a;outline-offset:-3px}
.pbar label{color:#f39120}
.tmr{background:#222a2a;color:#f39120;border-color:#4fbbbc}
.tmr .big{color:#4fbbbc}.tmr.go .big{color:#4fbbbc}
.btn{background:#222a2a;color:#f39120}
#finBtn{background:#ec4624;color:#fff}
.sclk button{background:#ec4624;color:#fff}
.card h2{border-bottom-color:#4fbbbc}.card h2::before{color:#ec4624}
.ex.done{background:#d3ecec!important}
.mq{background:#e2dac2}.iconbtn{background:#222a2a;color:#f39120}

/* ===== compact header + SKI TRAINING ===== */
:root{--e1:#4fbbbc;--e2:#f39120;--e3:#ec4624;--e4:#222a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--e4:#e2dac2}}
:root[data-theme="dark"]{--e4:#e2dac2}
.mast{border-top:0;border-bottom:1px solid var(--ink);padding:2px 0 4px;margin-bottom:4px;font-size:9.5px;letter-spacing:.8px}
.mast .mt{flex-direction:row;gap:10px;flex-wrap:wrap}
.mast .iconbtn{width:28px;height:28px;font-size:14px}
.mast .mi{gap:4px}
.brand{display:block}
.brand h1{padding:0 8px 8px 0;margin:2px 0 0;line-height:.9}
.ski{font-size:36px;line-height:.9;letter-spacing:1px;text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}}
:root[data-theme="dark"] .ski{text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}
.bt2{display:flex;gap:6px;margin-top:2px}
.bt2 .sub{margin:0;font-size:9.5px;padding:1px 6px;letter-spacing:.8px;background:#4fbbbc;color:#222a2a;white-space:nowrap}
header.top{padding:6px 0 4px}
header.top::after{height:6px;margin-top:6px}
.scroller{padding:4px 0 0;gap:6px}
.wk{padding:3px 8px;min-width:56px;border-width:2px}
.wk b{font-size:14px}.wk span{font-size:10px}
.tabs{padding-top:5px;gap:5px}
.tab{padding:3px 4px;font-size:14px}.tab small{font-size:9.5px}
.bar{height:9px;margin-top:6px}
.bar i::after{width:14px;height:14px;top:-3px;right:-7px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex.done{background:#2f5a5a!important}:root:not([data-theme="light"]) .tjt,:root:not([data-theme="light"]) .note{background:#465757}:root:not([data-theme="light"]) .spec b{background:#e2dac2}}
:root[data-theme="dark"] .ex.done{background:#2f5a5a!important}:root[data-theme="dark"] .tjt,:root[data-theme="dark"] .note{background:#465757}

/* ===== rounder shapes ===== */
.iconbtn,.mast .iconbtn{border-radius:50%}
.wk,.tab{border-radius:16px}
.bar{border-radius:999px}.bar i{border-radius:999px}
.sub,.bt2 .sub,.opt,.low,.skip{border-radius:999px}
.blk{border-radius:22px;overflow:hidden}
.blk .sec>span:first-child{border-radius:0}
.ex,.card{border-radius:18px}
.blk .ex{border-radius:16px}
.num,.blk .num{border-radius:50%}
.spec b{border-radius:12px}
.links button,.links a{border-radius:999px}
.btn,#finBtn,.sclk button{border-radius:999px}
.kg,.tjh,.tjt input,.field input,textarea,.field textarea{border-radius:12px}
.tjt,.note{border-radius:14px}
.pbar{border-radius:20px 20px 0 0}
.pbar button,.pbar button[data-p]{border-radius:50%;aspect-ratio:1/1;height:auto;max-height:36px;flex:1}
.tmr{border-radius:22px}.tmr button{border-radius:999px}
.banner,.mq{border-radius:16px}.mq .mrow button{border-radius:10px}
.panel{border-radius:24px 24px 0 0}
.swlist,.lib{border-radius:14px}
.ski{border-radius:0}
header.top::after{border-radius:999px}
.mast{border-radius:0}

.brand{display:flex;align-items:center;gap:12px}
.bt2{flex-direction:column;align-items:flex-start;gap:4px;margin:0 0 8px}
.ski{font-size:clamp(24px,8.6vw,36px);white-space:nowrap}
.brand{min-width:0}
.bt2{gap:6px;margin:0 6px 10px 0}
.bt2 .sub{background:none!important;color:var(--ink)!important;font-family:var(--fh);font-weight:700;font-size:clamp(11px,3.7vw,15px);line-height:1;letter-spacing:.8px;padding:0;border-radius:0;text-transform:uppercase;text-shadow:1px 1px 0 var(--e1),2px 2px 0 var(--e2),3px 3px 0 var(--e3),4px 4px 0 var(--e4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bt2 .sub{color:#e2dac2!important}}
:root[data-theme="dark"] .bt2 .sub{color:#e2dac2!important}
/* no drop shadows anywhere (the title's multi-line echo is kept) */
*,*::before,*::after{box-shadow:none!important}
.tmr,.panel,.sheet .panel{box-shadow:none!important;filter:none}

/* ===== D layer: one-shade progress chips, static header, compact, no tints ===== */
header.top{position:static!important}
body::before{display:none!important}
.wk,.tab{--c0:#e3f2f2;--c1:#c3e5e6;--c2:#93d1d2;--c3:#4fbbbc;--c4:#2b8f91;border:2px solid transparent!important;color:#222a2a}
.wk.l0,.tab.l0{background:var(--c0)!important}.wk.l1,.tab.l1{background:var(--c1)!important}.wk.l2,.tab.l2{background:var(--c2)!important}.wk.l3,.tab.l3{background:var(--c3)!important}
.wk.l4,.tab.l4{background:var(--c4)!important;color:#fff}
.wk span,.tab small{color:inherit!important;opacity:.8}

s are set as a share of it (80% → 110%), about +1.25 kg every other week. Vertical pull balances squat-day pressing volume elsewhere in the week.","video":"https://www.youtube.com/results?search_query=Weighted+Pull-Ups+exercise+technique"},{"t":"sec","text":"BLOCK 2 — SECONDARY COMPOUNDS (hypertrophy emphasis)"},{"t":"ex","id":"A-21","n":"12","name":"Incline Dumbbell Press","unit":"RIR 3-1","rest":"90s","tempo":"2-1-1-0","w":[{"s":"4×8–12","kg":50},{"s":"4×8–12","kg":52},{"s":"4×8–12","kg":52},{"s":"4×8–12","kg":54},{"s":"4×8–12","kg":46},{"s":"4×8–12","kg":56},{"s":"4×8–12","kg":56},{"s":"4×8–12","kg":58}],"kind":"Horizontal Push","focus":"HYP · Upper Chest (Clavicular Head)","note":"Upper-chest emphasis; classic hypertrophy rep range.","video":"https://www.youtube.com/results?search_query=Incline+Dumbbell+Press+exercise+technique"},{"t":"ex","id":"A-22","n":"13","name":"Romanian Deadlift","unit":"RIR 3-1","rest":"90s","tempo":"2-1-1-0","w":[{"s":"3×8–10","kg":95},{"s":"3×8–10","kg":97.5},{"s":"3×8–10","kg":100},{"s":"3×8–10","kg":102.5},{"s":"3×8–10","kg":85},{"s":"3×8–10","kg":105},{"s":"3×8–10","kg":107.5},{"s":"3×8–10","kg":110}],"kind":"Lower Hinge","focus":"HYP · Hamstring & Glute Stretch","note":"Hip-hinge/hamstring work; keep bar close, stop at mid-shin. Away from the gym: sandbag RDL (30 kg). Sandbags come in 10, 20 and 30 kg, so progress with reps or tempo between loads.","video":"https://www.youtube.com/results?search_query=Romanian+Deadlift+exercise+technique"},{"t":"sec","text":"BLOCK 3 — CORE / TRUNK"},{"t":"ex","id":"A-24","n":"14","name":"Hanging Leg Raise","unit":"RIR 1-2","rest":"75s","tempo":"2-1-1-0","w":[{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"},{"s":"3×10–15","kg":"BW"}],"kind":"Core Bracing","focus":"RP · Lower Abdominal \"Blocks\"","note":"Controlled reps beat momentum-driven reps for ab hypertrophy — no iation","focus":"RAMP · Potentiation","note":"Three progressively heavier sets before the first lift: about 50% x 6, 70% x 4, 85% x 2 of today's working weight. In R5-R8 use 5/3/1. Not counted as work sets.","video":"https://www.youtube.com/results?search_query=ramp+up+sets+warm+up+lifting"},{"t":"ex","id":"A-17","n":"8","name":"Back Squat","unit":"RIR 2","rest":"120s","tempo":"3-0-X-0","w":[{"s":"4×6–8","kg":85},{"s":"4×6–8","kg":87.5},{"s":"4×6–8","kg":90},{"s":"4×6–8","kg":80},{"s":"4×6–8","kg":92.5},{"s":"4×6–8","kg":95},{"s":"4×6–8","kg":97.5},{"s":"4×6–8","kg":100}],"kind":"Lower Push","focus":"EC · Quad & Glute Strength / Eccentric Control","note":"3 s lowering, drive up fast. Depth to your pain-free limit. Heaviest squat day of the 2 weeks, 6 reps in every rotation (the load rises about 2.5% per rotation instead of dropping the reps). Away from the gym: sandbag front squat or bear-hug squat with the 30 kg bag. Sandbags come in 10, 20 and 30 kg, so progress with reps or tempo between loads.","video":"https://www.youtube.com/results?search_query=back+squat+technique"},{"t":"ex","id":"A-18","n":"9","name":"Standing Single-Arm Dumbbell Press — leg drive","unit":"RIR 1-2","rest":"90s","tempo":"1-0-X-0","w":[{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":20},{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":22},{"s":"3×6–8/side","kg":22}],"kind":"Vertical Push","focus":"PWR · Shoulder Power / Leg-to-Arm Transfer","note":"Small dip, drive from the legs, press fast, lower for 1 s. Dumbbells go up in 2 kg steps. Away from the gym: sandbag press to shoulder (10 or 20 kg). Sandbags come in 10, 20 and 30 kg, so progress with reps or tempo between loads.","video":"https://www.youtube.com/results?search_query=standing+single+arm+dumbbell+press+leg+drive"},{"t":"sec","text":"BLOCK 3 — ATHLETIC ASSISTANCE (10 min) — circuit: one set of each exercise in turn, 45 s rest between exercises, 3 ro d":"cardio","name":"Cardio & VO2","short":"VO₂","tag":"3 sessions · run, bike, swim or row","knee":false,"weeks":[{"label":"W"}],"single":true,"sessions":[{"id":"Z2","tab":"Zone 2","pre":"Day 1 · ","heading":"Aerobic Base","meta":"Run, bike, swim or row · 45-70 min","opt":false,"items":[{"t":"sec","text":"WARM-UP (5-10 min)"},{"t":"ex","id":"Z2-70","n":"1","name":"Easy warm-up","unit":"Building to Zone 2, RPE 2-3","rest":"—","tempo":null,"w":[{"s":"5-10 min","kg":null}],"kind":"AER","focus":null,"note":"Start easy and let heart rate rise gradually into the Zone 2 range before settling into pace. Tip: Don't start at target pace cold — the first 5-10 min is a ramp, not the session.","video":"https://www.youtube.com/results?search_query=easy+jog+warm+up+technique+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"Z2-S1","n":"1","name":"Easy swim warm-up","unit":"RPE 2-3, no heart-rate range","rest":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+","mode":"Swim"},{"t":"ex","id":"Z2-S2","n":"2","name":"Drill set — catch-up & single-arm","unit":"RPE 3","rest":"20 s","tempo":null,"w":[{"s":"4 × 50 m","kg":null}],"kind":"DRL","focus":null,"note":"50 m catch-up drill, 50 m single-arm left, 50 m single-arm right, 50 m fingertip drag. Tip: Technique is the limiter in swimming far more than fitness.","video":"https://www.youtube.com/results?search_query=freestyle+catch+up+drill+single+arm+","mode":"Swim"},{"t":"sec","text":"MAIN SET — ZONE 2 STEADY STATE"},{"t":"ex","id":"Z2-72","n":"2","name":"Zone 2 Run","unit":"Run: {z2:run}  |  Bike: {z2:bike}","rest":"—","tempo":null,"w":[{"s":"40-60 min","kg":null}],"kind":"AER","focus":null,"note":"Run at a pace where you can hold a full conversation in complete sentences throughout. Nose breathing is a good proxy. Tip: This is the single biggest gap in most training stacks. Progress duration, not pace.","video":"https://www.youtube.com/results?search_query=zone+2+running+training+explained+","mode":"Run"},{"t":"ex","id":"Z2-73","n":"3","name":"Zone 2 Bike","unit":"Bike: {z2:bike} or RPE 3-4/10","rest":"—","tempo":null,"w":[{"s":"50-70 min","kg":null}],"kind":"AER","focus":null,"note":"Steady cadence 80-90rpm, moderate resistance. Same conversational-pace test as running. Tip: Cycling HR runs a touch lower than running at the same effort — use RPE as a cross-check.","video":"https://www.youtube.com/results?search_query=zone+2+cycling+training+explained+","mode":"Bike|Row|Other"},{"t":"ex","id":"Z2-S3","n":"3","name":"Zone 2 Swim","unit":"RPE 3-4, no heart-rate range","rest":"—","tempo":null,"w":[{"s":"30-45 min","kg":null}],"kind":"AER","focus":null,"note":"Steady front crawl, unbroken. Count strokes per length and try to hold the number as you tire. Tip: The straight aerobic option. Rising stroke count means form is degrading.","video":"https://www.youtube.com/results?search_query=continuous+freestyle+swim+aerobic+","mode":"Swim"},{"t":"ex","id":"Z2-S4","n":"6","name":"Pull-buoy swim (upper-body bias)","unit":"RPE 4-5","rest":"20 s","tempo":null,"w":[{"s":"6 × 100 m","kg":null}],"kind":"AER","focus":null,"note":"Pull buoy between the thighs, no kick. Optional paddles. Front crawl only. Tip: Legs float and switch off, so this spares them entirely — the best option in a heavy leg week.","video":"https://www.youtube.com/results?search_query=swimming+pull+buoy+set+technique+","mode":"Swim"},{"t":"sec","text":"COOL-DOWN (5 min)"},{"t":"ex","id":"Z2-75","n":"4","name":"Easy walk / spin-down","unit":"Below {z2lo:run}","rest":"—","tempo":null,"w":[{"s":"5 min","kg":null}],"kind":"REC","focus":null,"note":"Gradually reduce pace/resistance to bring heart rate down before stopping. Tip: Helps c est":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+","mode":"Swim"},{"t":"sec","text":"MAIN SET — CHOOSE ONE"},{"t":"ex","id":"VO2-83","n":"2","name":"Norwegian 4×4 Intervals (Run)","unit":"Run: {vo:run}  |  Bike: {vo:bike}","rest":"3 min easy jog","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"4 minutes at ~90-95% max HR, 3 minutes easy jog recovery, repeat 4 times. Tip: The most evidence-backed VO2max protocol available. Effort should feel 'comfortably hard' at minute 1.","video":"https://www.youtube.com/results?search_query=norwegian+4x4+interval+training+protocol+","mode":"Run"},{"t":"ex","id":"VO2-84","n":"3","name":"4×4 Intervals (Bike alternative)","unit":"Bike: {vo:bike} or RPE 8-9/10","rest":"3 min easy spin","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"Same structure as the run version — 4 min hard, 3 min easy spin, repeat 4 times. Tip: Bike is a good lower-impact substitute on weeks where the legs are beat up from lifting.","video":"https://www.youtube.com/results?search_query=4x4+interval+training+cycling+","mode":"Bike|Row|Other"},{"t":"ex","id":"VO2-85","n":"4","name":"30/30s Intervals","unit":"Above {hrmax} during work","rest":"—","tempo":null,"w":[{"s":"10-15 × 30s hard/30s easy","kg":null}],"kind":"VO2","focus":null,"note":"30 seconds at a hard, controlled sprint effort, 30 seconds easy jog/walk, repeat 10-15 times. Tip: Shorter, more repeatable efforts than the 4×4 — good variation to manage joint load.","video":"https://www.youtube.com/results?search_query=30+30+interval+training+running+","mode":"Run"},{"t":"ex","id":"VO2-86","n":"5","name":"Hill Repeats","unit":"RPE 8-9/10 uphill","rest":"Walk/jog down","tempo":null,"w":[{"s":"8-10 × 45-60s uphill","kg":null}],"kind":"VO2","focus":null,"note":"Find a moderate 5-8% grade hill. Run hard uphill for 45-60s, walk or jog back down for full recovery. Tip: Lower impact than flat sprinting and builds power/economy alongside VO2max.","video":"https://www.youtube.com/results?search_query=hill+repeats+running+workout+","mode":"Run"},{"t":"ex","id":"VO2-S2","n":"5","name":"Short speed intervals (Swim)","unit":"RPE 8-9","rest":"30 s","tempo":null,"w":[{"s":"12-16 × 50 m","kg":null}],"kind":"VO2","focus":null,"note":"50 m fast, 30 s rest. Hold technique at speed — stop the set when the stroke breaks down. Tip: Use only if you skipped the Thursday VO2max session.","video":"https://www.youtube.com/results?search_query=swimming+50m+sprint+interval+set+","mode":"Swim"},{"t":"ex","id":"VO2-S3","n":"5","name":"4 × 4 min hard (Swim)","unit":"RPE 8-9, no heart-rate range","rest":"3 min easy","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"Four minutes at a hard, controlled pace, three minutes easy swimming between. Hold technique; stop a rep early rather than let the stroke fall apart.","video":"https://www.youtube.com/results?search_query=swimming+50m+sprint+interval+set+","mode":"Swim"},{"t":"sec","text":"COOL-DOWN (10 min)"},{"t":"ex","id":"VO2-88","n":"6","name":"Easy cool-down","unit":"Below {z2lo:run}","rest":"—","tempo":null,"w":[{"s":"10 min","kg":null}],"kind":"REC","focus":null,"note":"Gradually reduce pace to an easy jog or spin, letting heart rate settle. Tip: Do not skip this after VO2max work — it meaningfully speeds recovery for the next session.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"VO2-S4","n":"7","name":"Easy backstroke or breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+","mode":"Swim"}],"modes":["Run","Bike","Swim","Row","Other"]},{"id":"TH","tab":"Threshold","pre":"Day 3 · ","heading":"Threshold / Tempo + Running Economy Drills","meta":"Run, bike, swim or row · 40-45 min","opt":false,"items":[{"t":"sec","text":"WARM-UP + RUNNING DRILLS (10-12 min)"},{"t":"ex","id":"TH-93","n":"1","name":"Easy warm-up","unit":"RPE 2-3","rest":"—","tempo":null,"w":[{"s":"5 min","kg":null}],"kind":"AER","focus":null,"note":"Easy jog or spin to raise core temperature before drill work. Tip: Keep this genuinely easy — the drills are the warm-up quality work, not this jog.","video":"https://www.youtube.com/results?search_query=easy+jog+warm+up+technique+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"TH-S1","n":"1","name":"Easy swim warm-up","unit":"RPE 2-3, no heart-rate range","rest":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+","mode":"Swim"},{"t":"ex","id":"TH-94","n":"2","name":"A-Skip","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Skip forward driving the knee to hip height, punch the ground actively with the foot under the hip. Tip: Reinforces hip flexion timing and ground contact mechanics.","video":"https://www.youtube.com/results?search_query=A+skip+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-95","n":"3","name":"B-Skip","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Same as A-Skip but extend the leg forward and actively pull it down and back before contact. Tip: Trains the hamstring 'pawing' action that reduces overstriding.","video":"https://www.youtube.com/results?search_query=B+skip+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-96","n":"4","name":"High Knees","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Quick, tall cadence, knees driving up to hip height, minimal ground contact time. Tip: Cadence and ankle stiffness — both directly improve running economy.","video":"https://www.youtube.com/results?search_query=high+knees+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-97","n":"5","name":"Butt Kicks","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Quick cadence, heels kicking up toward the glutes, minimal forward lean. Tip: Hamstring/quad cycling speed — complements the A/B skip pair.","video":"https://www.youtube.com/results?search_query=butt+kicks+running+drill+tutorial+","mode":"Run"},{"t":"sec","text":"MAIN SET — THRESHOLD"},{"t":"ex","id":"TH-99","n":"6","name":"Continuous Tempo Run","unit":"Run: {th:run}  |  Bike: {th:bike}","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Run at a pace you could sustain for about an hour if you had to — hard but controlled, not a race effort. Tip: This raises the pace you can hold before lactate accumulates.","video":"https://www.youtube.com/results?search_query=tempo+run+pacing+guide+","mode":"Run"},{"t":"ex","id":"TH-100","n":"7","name":"Sweet Spot Bike (alternative)","unit":"Bike: {th:bike} or RPE 6-7/10","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Steady, hard-but-sustainable effort — you could speak in short sentences, not full ones. Tip: Bike sweet-spot work is a very time-efficient threshold stimulus with low joint impact.","video":"https://www.youtube.com/results?search_query=sweet+spot+training+cycling+explained+","mode":"Bike|Row|Other"},{"t":"ex","id":"TH-S2","n":"4","name":"Threshold intervals (Swim)","unit":"RPE 6-7","rest":"20-30 s","tempo":null,"w":[{"s":"8-10 × 100 m","kg":null}],"kind":"THR","focus":null,"note":"100 m at a hard-but-repeatable pace, 20-30 s rest on the wall. Every rep within 2-3 s of the first. Tip: The swim equivalent of the tempo run.","video":"https://www.youtube.com/results?search_query=swimming+100m+threshold+interval+set+","mode":"Swim"},{"t":"sec","text":"STRIDES + COOL-DOWN (8 min)"},{"t":"ex","id":"TH-102","n":"8","name":"Strides","unit":"~90-95% top speed","rest":"full walk-back","tempo":null,"w":[{"s":"6 × 100m","kg":null}],"kind":"DRL","focus":null,"note":"Gradual acceleration over the first 30m, hold near-top speed for the middle, relax off the last 20m. Tip: Not a conditioning tool — neuromuscular speed and mechanics work.","video":"https://www.youtube.com/results?search_query=running+strides+technique+tutorial+","mode":"Run"},{"t":"ex","id":"TH-103","n":"9","name":"Easy walk","unit":"Below {z2lo:run}","rest":"—","tempo":null,"w":[{"s":"3-5 min","kg":null}],"kind":"REC","focus":null,"note":"Walk it out, let heart rate settle before finishing. Tip: Closes out the session and starts the recovery clock for tomorrow.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"TH-S3","n":"7","name":"Easy backstroke or breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+","mode":"Swim"}],"modes":["Run","Bike","Swim","Row","Other"]}],"version":"1"},"protocol":{"id":"protocol","name":"Protocol","short":"PRO","tag":"the year at a glance","knee":false,"info_only":true,"weeks":[{"label":"W"}],"sessions":[],"blocks":[{"title":"Repeating cycle","kind":"cards","head":["Block","Monday","Tuesday","Wednesday","Thursday","Friday","Sat / Sun"],"rows":[["Athletic Power","Session A / D","Cardio, Zone 2","Session B / E","Cardio, VO₂","Session C / F","Cardio, Zone 2 (optional: run, bike or swim)"],["Strength","Workout A","Cardio, Threshold","Workout B","Cardio, VO₂","Workout C","Cardio, Zone 2 (optional: run, bike or swim)"],["Ski Training 8 Weeks","Ski Day 1","Cardio, Zone 2","Ski Day 2","Cardio, VO₂","Ski Day 3","Saturday: Ski Day 4 (optional)"],["Ski Training 5 Weeks","Ski Day 1","Cardio, Zone 2","Ski Day 2","Cardio, VO₂","Ski Day 3","Saturday: Ski Day 4 (optional)"],["Conditioning","Session 1","Cardio, Threshold","Session 2","Cardio, VO₂","Session 3","Cardio, Zone 2 (optional: run, bike or swim)"],["Cardio & VO₂ block","Cardio, Zone 2","Cardio, VO₂","Mobility or rest","Cardio, Threshold","Mobility or rest","Cardio, Zone 2 (optional: run, bike or swim)"],["Mobility","Morning, 10 min","Evening, 15 min","Knee & feet","Morning, 10 min","Evening, 15 min","Any routine you like"],["No-Gym 3 Days","Session A","Walk or rest","Session B","Walk or rest","Session C","Cardio, Zone 2 (optional: run, bike or swim)"],["Away week (No-Gym 3 Days)","Session A","Walk or rest","Session B","Walk or rest","Session C","Cardio, Zone 2 (optional: run, bike or swim)"],["Trip week","Skipped","Skipped","Skipped","Skipped","Skipped","Free. Sport trip: your sport. Non-sport trip: No-Gym 3 Days."],["Easy week","Walk and mobility","Cardio, Zone 2","Walk and mobility","Cardio, Zone 2","Walk and mobility","Cardio, Zone 2 (optional: run, bike or swim)"],["Rest","Rest","Rest","Rest","Rest","Rest","Rest"]],"links":[["athletic:A","cardio:Z2","athletic:B","cardio:VO2","athletic:C","cardio:Z2"],["strength:A","cardio:TH","strength:B","cardio:VO2","strength:C","cardio:Z2"],["ski8:D1","cardio:Z2","ski8:D2","cardio:VO2","ski8:D3","ski8:D4"],["ski:D1","cardio:Z2","ski:D2","cardio:VO2","ski:D3","ski:D4"],["conditioning:S1","cardio:TH","conditioning:S2","cardio:VO2","conditioning:S3","cardio:Z2"],["cardio:Z2","cardio:VO2","","cardio:TH","","cardio:Z2"],["mobility:AM","mobility:PM","mobility:KN","mobility:AM","mobility:PM","mobility:AM"],["nogym:A","","nogym:B","","nogym:C","cardio:Z2"],["nogym:A","","nogym:B","","nogym:C","cardio:Z2"],["","","","","","nogym:A"],["","cardio:Z2","","cardio:Z2","","cardio:Z2"],["","","","","",""]]},{"title":"Every day","kind":"lines","rows":[["Morning","10-12 min dynamic routine","Mobility sheet, Section 2. Non-negotiable — it also covers your daily ankle and hip work."],["Before every lift","The primer for that session","The WARM-UP block at the top of each session on the training sheet — different for every workout."],["Evening","15-20 min static routine","Mobility sheet, Section 3. Where all the long holds belong — lead with whatever you trained that day."]]},{"title":"The training year","kind":"cards","head":["Period","What you run","","Why","","Sheet"],"rows":[["January","Ski trip 2. Morning and evening mobility only. Between the two trips (late Dec to the trip): 2 light sessions a week from Ski Training (Day 1 and Day 3) and 2 cardio sessions.","","The December Ski Training block already prepares both trips because they are only weeks apart, so no second block is needed.","","Ski Training · Mobility"],["Week after trip 2","Easy week: 2 light sessions, walking, mobility","","Transition into the big block. Legs back to normal before heavy lifting.","","Mobility"],["Late January — mid May / (16 weeks)","Athletic Power — 3 lifting days a week: A B C in week 1 of each rotation, D E F in week 2. Cardio on Tuesday and Thursday.","","Your main block: power, a heavy lift, size work, knee and hamstring care and core in every session. The first rotation is the gentle start; R4 and R8 are lighter.","","Athletic Power · Cardio & VO₂"],["Mid May — end July / (about 11 weeks)","Strength A/B/C ⇄ Athletic A/B/C, alternating weekly, with Cardio & VO₂ 3× a week","","Size and strength after the athletic block. Set working weights from your Athletic Power numbers.","","Strength · Athletic Power · Cardio & VO₂"],["Away or rest weeks / (any time)","Add an Away week (No-Gym 3 Days) or a Rest block in the calendar plan. A trip or rest of 5 or more days pauses the program and pushes it back one week.","","Your recovery window. Travel without equipment still keeps the legs, push and core ticking over.","","No-Gym 3 Days"],["September — mid October","Strength A/B/C ⇄ Athletic A/B/C, alternating weekly, with Cardio & VO₂ 3× a week","","Last build before ski preparation.","","Strength · Athletic Power · Cardio & VO₂"],["Mid October — early December / (8 weeks)","Ski Training — 3 core sessions a week plus 1 optional, PLUS 2 cardio sessions","","REPLACES both A/B/C sheets. Heavy lower and upper days inside the plan protect your strength; knee rules apply (pain-free range only). Use the 5-week version if you start late.","","Ski Training · Cardio & VO₂"],["December","Ski trip 1. Morning and evening mobility only. Then straight into the between-trips sessions and trip 2 in January.","","You are there to ski. Week 8 of the ski plan tapers you into it.","","Mobility"]]},{"title":"Ski plan dates","kind":"lines","rows":[["Ski trip 1 — first day","12 Dec 2026",null],["Ski block starts — Week 1","19 Oct 2026","Always a Monday. Last A/B/C week ends. Day 1: first TJT test and symmetry check — record both in the ski cockpit."],["Week 4 — mid-plan re-test","9 Nov 2026","Monday of week 4: second TJT test and symmetry check re-baseline weeks 4-6."],["Week 7 — peak week + final test","30 Nov 2026","Monday of week 7: third TJT test and symmetry check. The hardest week of the block."],["Week 8 — taper begins","7 Dec 2026","Trip on a Friday, Saturday or Sunday: the taper is the trip week itself. Trip Monday to Thursday: the taper is the week before."],["Last session","10 Dec 2026","Two days before the trip at the latest. If the taper week is short, fit its sessions into the days available; skip Day 4."],["First ski day","12 Dec 2026","Arrive fresh rather than marginally fitter and fatigued."]]},{"title":"Rules that keep it honest","kind":"lines","rows":[["Never stack blocks","","The ski plan replaces the A/B/C sheets and the cardio plan. It is not run in addition to them."],["Weighted pull-ups every week","","They appear in Strength Workout A and Athletic Workout C, so the lift is trained on both weeks of the cycle."],["Deloads line up","","One planned deload per 16-week cycle: Strength W5 (calendar week 9). Athletic W5 holds its W4 loads. Cut cardio interval volume by half in the Strength W5 week too."],["Hard cardio away from heavy legs","","Cardio Day 2 (VO₂) is the only genuinely hard cardio session — keep it off your heaviest lower-body day."],["Retest before re-setting loads","","After any break or the ski block, retest key lifts rather than assuming the old working weights still apply."],["Mobility is not optional","","It is the one thing that runs every single day of the year, in every block."],["Conditioning swap","","In the Strength W5 deload week, you may swap the Thursday VO₂ cardio session for a Conditioning session — lifting volume is already reduced that week, so it is a good slot to add variety without extra fatigue."]]}],"version":"1"},"mobility":{"id":"mobility","name":"Mobility","short":"MOB","tag":"daily · 3 sessions","knee":false,"single":true,"weeks":[{"label":"W"}],"version":"1","sessions":[{"id":"AM","tab":"Morning","pre":"","heading":"Morning routine","meta":"about 10 min · 8 moves · dynamic, no long holds","opt":false,"items":[{"t":"ex","id":"AM-12","n":"1","name":"Cat–cow","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"8-10 slow","kg":null}],"kind":"Mobility","focus":null,"note":"On all fours, alternate rounding and arching the back in time with your breathing. Why: Gently mobilises the spine without loading fresh, fluid-filled discs.","video":"https://www.youtube.com/results?search_query=Cat+cow+exercise+technique"},{"t":"ex","id":"AM-13","n":"2","name":"Thoracic open-book","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Side-lying, knees stacked and bent, arms out in front. Open the top arm across and follow it with your eyes. Why: Restores overnight mid-back and rib stiffness.","video":"https://www.youtube.com/results?search_query=Thoracic+open-book+exercise+technique"},{"t":"ex","id":"AM-14","n":"3","name":"Glute bridge","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"10-12","kg":null}],"kind":"Strength","focus":null,"note":"Feet flat, drive through the heels, squeeze hard at the top for a second. Why: Wakes the glutes before they spend the day switched off.","video":"https://www.youtube.com/results?search_query=Glute+bridge+exercise+technique"},{"t":"ex","id":"AM-15","n":"4","name":"Dead bug","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Strength","focus":null,"note":"Lower back gently pressed into the floor, lower the opposite arm and leg slowly. Why: Core switched on without any spinal flexion.","video":"https://www.youtube.com/results?search_query=Dead+bug+exercise+technique"},{"t":"ex","id":"AM-16","n":"5","name":"Hip CARs","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Standing, slow controlled hip circles with the pelvis kept still. Why: Full hip range claimed before the day shortens it.","video":"https://www.youtube.com/results?search_query=Hip+CARs+exercise+technique"},{"t":"ex","id":"AM-17","n":"6","name":"World's greatest stretch","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Long lunge, same-side elbow down towards the instep, then rotate the other arm to the ceiling. Why: Hips, mid-back and hamstrings in a single movement.","video":"https://www.youtube.com/results?search_query=World%27s+greatest+stretch+exercise+technique"},{"t":"ex","id":"AM-18","n":"7","name":"90-90 Hip Switches","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×8 slow","kg":null}],"kind":"Mobility","focus":null,"note":"Sit in 90-90, rotate to the opposite 90-90 without hands, slow and controlled. Why: Hip internal/external rotation under control. Responds to daily consistency more than any other single drill. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=90-90+Hip+Switches+exercise+technique"},{"t":"ex","id":"AM-19","n":"8","name":"Ankle Knee-to-Wall","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Foot pointing at wall, heel down, drive the knee forward to touch. Move foot back to your limit. Why: Restores dorsiflexion — a hard limiter on squat depth and landings. Measure toe-to-wall monthly. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=Ankle+Knee-to-Wall+exercise+technique"}]},{"id":"PM","tab":"Evening","pre":"","heading":"Evening routine","meta":"about 15 min · 8 holds of 45–60 s","opt":false,"items":[{"t":"ex","id":"PM-26","n":"1","name":"Couch stretch","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Back foot up on a bench or against a wall. Squeeze the glute and tuck the tailbone before you come upright. Why: Undoes the day's single biggest shortening. Tip: The longest-standing tightness you have. Go to 2×90 s / side on squat days.","video":"https://www.youtube.com/results?search_query=Couch+stretch+exercise+technique"},{"t":"ex","id":"PM-27","n":"2","name":"Supine figure-4","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, ankle across the opposite knee, pull that knee towards the chest. Why: Glutes and deep rotators from a low-effort position.","video":"https://www.youtube.com/results?search_query=supine+figure+4+stretch"},{"t":"ex","id":"PM-28","n":"3","name":"Hamstring stretch with a strap","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, strap around the foot, leg raised with a soft knee and the other leg flat. Why: Hamstrings without loading the lower back.","video":"https://www.youtube.com/results?search_query=Hamstring+stretch+with+a+strap+exercise+technique"},{"t":"ex","id":"PM-29","n":"4","name":"90-90 hip static hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Front leg bent 90° across your body, back leg bent 90° out to the side. Sit tall, then hinge slowly forward over the front leg and hold. Swap sides. Why: Passive end-range hip external rotation (front leg) and internal rotation (back leg) — held long enough to change tissue length, not just access range. Tip: Passive counterpart to the morning switches and lift-offs.","video":"https://www.youtube.com/results?search_query=90+90+hip+stretch"},{"t":"ex","id":"PM-30","n":"5","name":"Child's pose with side reach","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Sit back onto the heels and reach the arms long, then walk them to each side. Why: Lats, flanks and lower-back decompression.","video":"https://www.youtube.com/results?search_query=Child%27s+pose+with+side+reach+exercise+technique"},{"t":"ex","id":"PM-31","n":"6","name":"Supine spinal twist","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, drop both bent knees to one side while the shoulders stay down. Why: Releases mid-back and lower-back tension.","video":"https://www.youtube.com/results?search_query=Supine+spinal+twist+exercise+technique"},{"t":"ex","id":"PM-32","n":"7","name":"Deep Squat Hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60 s","kg":null}],"kind":"Mobility","focus":null,"note":"Sink into the deepest squat you can hold, heels down, elbows inside knees pushing out, breathe deeply. Why: Loaded end-range hip and ankle position — changes squat depth over 4-6 weeks better than passive stretching. The position both skiing and lifting borrow from. Tip: Also worth 45 s as part of a pre-training warm-up on the training sheet.","video":"https://www.youtube.com/results?search_query=Deep+Squat+Hold+exercise+technique"},{"t":"ex","id":"PM-34","n":"9","name":"Thoracic extension over a roller","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s","kg":null}],"kind":"Mobility","focus":null,"note":"Roller across the mid-back, support the head, extend back over it, move up 2 cm and repeat. Why: Mid-back extension, stiffened by both pressing and heavy rowing. Tip: Lead with this after an upper or pressing day.","video":"https://www.youtube.com/results?search_query=Thoracic+extension+over+a+roller+exercise+technique"}]},{"id":"KN","tab":"Knee & feet","pre":"","heading":"Knee, ankle and feet","meta":"about 15 min · 3 days a week · mobilise, strengthen, balance","opt":false,"items":[{"t":"sec","text":"Mobilise"},{"t":"ex","id":"KN-42","n":"1","name":"Knee-to-wall ankle mobilisation","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Same position as the test. Drive the knee forward over the toes, heel glued down, then release. Move in and out of the range rather than holding. Why: Restores dorsiflexion so the foot no longer needs to splay to find depth. Tip: Baseline R 7 / L 8 cm (18 Oct 2026). Target +1-2 cm in 4 weeks; move the foot back about 0.5 cm per week. Same dose as the morning routine (Section 2), done once, in the morning.","video":"https://www.youtube.com/results?search_query=Knee-to-wall+ankle+mobilisation+exercise+technique"},{"t":"ex","id":"KN-43","n":"","name":"Calf stretch — bent knee, then straight knee","unit":"3× a week","rest":null,"tempo":"slow","w":[{"s":"45 s + 45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Staggered stance against a wall, back heel down. First 45 s with the back knee BENT (soleus), then 45 s with the back leg straight (gastrocnemius). One merged calf block instead of two.","video":null},{"t":"ex","id":"KN-45","n":"4","name":"Hip internal rotation — prone or seated lift-off","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"2×8 / side","kg":null}],"kind":"Strength","focus":null,"note":"Seated at 90/90 or lying face down with the knee bent to 90°: turn the foot outward so the thigh rotates inward, hold 2 s at the end, lower slowly. Add a light band when it is easy. Why: Active internal rotation of the hip, the movement that turns the toes in and stops the knee collapsing inward when the feet point straight. Tip: Compare both sides with the prone hip rotation check above; the weaker side goes first.","video":"https://www.youtube.com/results?search_query=hip+internal+rotation+lift+off+prone+90+90"},{"t":"sec","text":"Strengthen"},{"t":"ex","id":"KN-49","n":"","name":"Short-foot hold","unit":"3× a week","rest":null,"tempo":"slow","w":[{"s":"3×20 s / side","kg":null}],"kind":"Strength","focus":null,"note":"Sitting, then standing: pull the ball of the big toe towards the heel without curling the toes, so the arch rises. Keep the toes long and relaxed. Build up to the standing version.","video":null},{"t":"ex","id":"KN-50","n":"","name":"Toe yoga","unit":"3× a week","rest":null,"tempo":"slow","w":[{"s":"2×8","kg":null}],"kind":"Strength","focus":null,"note":"Foot flat: lift only the big toe, keep the other four down, then lower it and lift the other four with the big toe down. Slow and controlled; go back and forth.","video":null},{"t":"ex","id":"KN-46","n":"5","name":"Single-leg chair squat — knee over the 2nd toe","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"3×6 / side","kg":null}],"kind":"Strength","focus":null,"note":"Stand on one leg in front of a chair or box. Sit back and down for 3 s until you just touch, then stand without pushing off the seat. Knee tracks over the second toe, pelvis level. A hand on a wall or a mini band above the knee helps if the knee caves. Why: Trains single-leg knee control and the hip internal rotators at once, in the stance you actually have. Tip: Pain-free range only, 0-3/10. Use a higher chair if the knee complains. Progression: lower the chair or box; then 4 s lowering; then hold a 10 kg sandbag at the chest. Move on only when all sets are clean, knee over the 2nd toe.","video":"https://www.youtube.com/results?search_query=single+leg+chair+squat+knee+valgus"},{"t":"sec","text":"Balance"},{"t":"ex","id":"KN-47","n":"6","name":"Single-leg stance with big-toe raise","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"3×30 s / side","kg":null}],"kind":"Strength","focus":null,"note":"Stand on one leg, barefoot, foot flat, knee soft. Press the big toe and the ball of the foot down while you lift the other four toes, or lift only the big toe, and keep the arch up. Hold for balance. Why: Activates the big toe and the arch (tripod foot) that control the foot angle and help the knee stay over the toes. Tip: Closer to the old short-foot drill, now on one leg, so the knee and the ankle work together.","video":"https://www.youtube.com/results?search_query=single+leg+stance+big+toe+raise+arch"},{"t":"ex","id":"KN-48","n":"7","name":"Pallof press on one leg — band","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"3×10 / side","kg":5}],"kind":"Strength","focus":null,"note":"Band at chest height beside you. Stand on one leg with a soft knee, press the band straight out and hold 2 s, return with control. Do not let the trunk or the knee twist. Why: Anti-rotation core plus single-leg hip and knee stability, in one exercise. Tip: Do both legs; start on the right (the knee that needs work). Band box: log the band resistance in kg (a light band is about 5, a medium about 10). Progression: step further from the anchor, then add a 2 s hold at full extension.","video":"https://www.youtube.com/results?search_query=single+leg+pallof+press+band"}]}]},"conditioning":{"id":"conditioning","name":"Conditioning","short":"CND","tag":"11 weeks · 3 sessions","knee":false,"version":"1","weeks":[{"label":"W1"},{"label":"W2"},{"label":"W3"},{"label":"W4"},{"label":"W5"},{"label":"W6"},{"label":"W7"},{"label":"W8"},{"label":"W9"},{"label":"W10"},{"label":"W11"}],"sessions":[{"id":"S1","tab":"Session 1","pre":"Session 1 · ","heading":"lower body + complex + metcon","meta":"","opt":false,"items":[{"t":"sec","text":"WARM-UP","_w":0},{"t":"ex","id":"C1-1-8","n":"1","name":"Skip / Cossack Squat / Dive Bomber Push-Up / Curtsey Squat circuit","unit":"","rest":null,"tempo":null,"w":[{"s":"3 rounds, 30s skip between movements","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null}],"kind":"MOB","focus":"Mobility","note":"Skip: steady rope pace. Cossack squat: feet wide, sink onto one bent leg keeping the other straight, torso upright. Dive bomber push-up: from a downward-dog, dive your head toward the floor and sweep through to a raised chest, then reverse. Curtsey squat: step one leg behind and across the other, squat low on the standing leg. Purpose: raises heart rate and core temperature, opens the hips in multiple directions (Cossack/Curtsey), and primes the shoulders for overhead/pressing work later in the session. Load: Bodyweight Raise HR, prime hips & shoulders"," const dsF=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const localToday=()=>{const n=new Date();return dsF(n.getFullYear(),n.getMonth(),n.getDate())};
function sessLabel(P,wi,sid){const se=P.sessions.find(z=>z.id===sid);let label=P.single?((se&&se.tab)||sid):(((se&&se.pre)||('Day '+sid.replace(/\D/g,'')+' · ')).replace(/\s*·\s*$/,'')||sid);if(!P.single&&P.weeks[wi])label+=' · '+P.weeks[wi].label;return label}
function calEvents(){const m={};PORDER.forEach(id=>{if(id==='protocol')return;const st=getState(id),P=PROGS[id];const seen={};
  const push=(date,k,h)=>{if(!date||date.slice(0,4)!==String(CALY)||!(h.done>0))return;const a=k.split('|'),wi=+a[0],sid=a[1];const sk=date+'|'+k;if(seen[sk])return;seen[sk]=1;
    (m[date]=m[date]||[]).push({p:id,sid,wi,key:k,label:sessLabel(P,wi,sid),name:P.name,h})};

function tripsOn(d){return CAL.trips.filter(t=>t.from<=d&&d<=(t.to||t.from))}

function calSummary(ev,from,to){let ses=0,mob=0,tan=0,trip=0,cardio=0,act=0;
  for(let d=new Date(from+'T12:00:00');;d.setDate(d.getDate()+1)){const ds=dsF(d.getFullYear(),d.getMonth(),d.getDate());if(ds>to)break;
    const i=dayInfo(ds,ev);ses+=i.train.length;cardio+=i.train.filter(x=>x.p==='cardio').length;if(i.mobAny)mob++;if(i.tango)tan++;if(tripsOn(ds).length)trip++;if(i.train.length)act++}
  return {ses,mob,tan,trip,cardio,act}}

  return `<button class="pcard" data-p="cal"><span class="pdot" style="background:#222a2a;color:#f39120">CAL</span><span class="pmid"><b>Calendar</b><small>${esc(wkText(planNow())||t.ses+' sessions')}</small></span><span class="pgo">›</span></button>`}
const DC=p=>p==='cardio'?'#b0a47e':PCOL[p];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

// ---- planner
const addD=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return dsF(d.getFullYear(),d.getMonth(),d.getDate())};
const monOf=ds=>addD(ds,-((new Date(ds+'T12:00:00').getDay()+6)%7));
const BTYPES={athletic:'Athletic 3+3',strength:'Strength',ski:'Ski 5 Week',ski8:'Ski Training 8 Weeks',cond:'Conditioning',summer:'Summer (2 sessions)',easy:'Easy week',trip:'Trip'};
const firstMonY=()=>{const m=monOf(CALY+'-01-01');return m<CALY+'-01-01'?addD(m,7):m};
function planWeeks(){loadCal();const cfg=CAL.cfg||{};const ath0=cfg['ath'+CALY]||addD(firstMonY(),7);
  const trips=CAL.trips.filter(t=>t.kind!=='other').map(t=>Object.assign({},t,{to:t.to||t.from}));
  const ws=[];for(let m=firstMonY();m<=CALY+'-12-31';m=addD(m,7))ws.push(m);
  const T={};
  const ovl=(m,t)=>{let n=0;for(let i=0;i<7;i++){const d=addD(m,i);if(d>=t.from&&d<=t.to)n++}return n};
  const allTrips=CAL.trips.map(t=>Object.assign({},t,{to:t.to||t.from}));
  ws.forEach(m=>{const hit=allTrips.filter(t=>ovl(m,t)>=3);if(hit.length)T[m]={t:'trip',name:hit[0].name||'Trip',maybe:hit[0].maybe}});
  allTrips.forEach(t=>{if(t.kind==='other')return;const days=Math.round((new Date(t.to)-new Date(t.from))/864e5)+1;if(days<3)return;const m=addD(monOf(t.to),7);if(ws.includes(m)&&!T[m])T[m]={t:'easy'}});
  trips.filter(t=>t.kind==='ski').sort((a,b)=>a.from.localeCompare(b.from)).forEach(sk=>{
    const m0=monOf(sk.from);let lim='0000';trips.forEach(t=>{if(t!==sk&&t.to<sk.from){const e=addD(monOf(t.to),14);if(e>lim)lim=e}});
    let st=addD(m0,-28);if(st<lim)st=lim;const lst=[];for(let m=st;m<=m0;m=addD(m,7))if(ws.includes(m)&&!T[m])lst.push(m);
    lst.forEach((m,i)=>{T[m]={t:'ski',k:5-lst.length+i,name:sk.name,short:lst.length<5}})});
  (CAL.blocks||[]).forEach(b=>{const m0=monOf(b.from);for(let i=0;i<(+b.weeks||1);i++){const m=addD(m0,7*i);if(ws.includes(m))T[m]={t:b.type,k:i,manual:true}}});
  let ak=0,sk=0,ck=0;
  ws.forEach(m=>{if(T[m]){return}
    if(m<ath0)T[m]={t:'cond',k:ck++};
    else if(ak<16){T[m]={t:'athletic',k:ak++}}
    else if(m.slice(5,7)==='08')T[m]={t:'summer',k:ck++};
    else T[m]={t:'strength',k:sk++}});
  let run=0;const out=ws.map(m=>{const w=Object.assign({mon:m},T[m]);if(w.t==='trip'||w.t==='easy')run++;else{if(run>=3)w.retest=true;run=0}if(w.t==='strength'&&(w.k||0)%8===4)w.deload=true;return w});return out}
function weekSess(w){const k=w.k||0;
  if(w.t==='athletic'){const o=k%2?['D','E','F']:['A','B','C'],r=Math.floor(k/2);return [[0,'athletic',o[0],r],[2,'athletic',o[1],r],[4,'athletic',o[2],r],[1,'cardio','Z2',0],[3,'cardio','VO2',0]]}
  if(w.t==='strength'){const r=k%8;return [[0,'strength','A',r],[2,'strength','B',r],[4,'strength','C',r],[1,'cardio','TH',0],[3,'cardio','VO2',0]]}
  if(w.t==='ski'||w.t==='ski8'){const p=w.t,kk=Math.min(k,PROGS[p].weeks.length-1);return [[0,p,'D1',kk],[2,p,'D2',kk],[4,p,'D3',kk],[1,'cardio','Z2',0],[3,'cardio','VO2',0]]}
  if(w.t==='cond'){const r=k%11;return [[0,'conditioning','S1',r],[2,'conditioning','S2',r],[4,'conditioning','S3',r],[1,'cardio','TH',0],[3,'cardio','VO2',0]]}
  if(w.t==='summer'){const r=k%11;return [[0,'conditioning','S1',r],[4,'conditioning','S3',r]]}
  if(w.t==='easy')return [[1,'cardio','Z2',0],[3,'cardio','SW',0]];
  return []}
function loggedIn(p,wi,sid,mon){const st=getState(p),P=PROGS[p],k=wi+'|'+sid;let hit=false;
  Object.entries(st.days||{}).forEach(([d,L])=>{if(L[k]&&L[k].done>0&&(!P.single||(d>=mon&&d<=addD(mon,6))))hit=true});
  const h=st.hist&&st.hist[k];if(!hit&&h&&h.done>0&&h.date&&(!P.single||(h.date>=mon&&h.date<=addD(mon,6))))hit=true;return hit}
let PLANC=null;
function planItems(){loadCal();const cache=JSON.stringify([CALY,CAL.trips,CAL.blocks,CAL.cfg,CAL.moves,CAL.skip]);if(PLANC&&PLANC.k===cache)return PLANC.v;
  const out={},weeks=planWeeks();
  weeks.forEach(w=>weekSess(w).forEach(([dow,p,sid,wi])=>{const key=w.mon+'|'+p+'|'+sid;if((CAL.skip||{})[key])return;
    const date=(CAL.moves||{})[key]||addD(w.mon,dow);if(tripsOn(date).some(t=>t.kind!=='other'))return;
    (out[date]=out[date]||[]).push({key,p,sid,wi,mon:w.mon,label:sessLabel(PROGS[p],wi,sid)+((w.deload&&p==='cardio')?' · half volume':''),name:PROGS[p].name,done:loggedIn(p,wi,sid,w.mon),block:w.t})}));

function planNow(){loadCal();planItems();const m=monOf(localToday());const w=(PLANC.weeks||[]).find(x=>x.mon===m);return w}
function wkText(w){if(!w)return '';const k=w.k||0;
  if(w.t==='athletic')return 'Athletic 3+3 · R'+(Math.floor(k/2)+1)+' · week '+(k%2+1)+(w.retest?' · retest key lifts first':'');
  if(w.t==='strength')return 'Strength · W'+(k%8+1)+(w.deload?' · deload week':'')+(w.retest?' · retest key lifts first':'');

  if(w.t==='easy')return 'Easy week: 2 light sessions, walking, mobility';
  if(w.t==='trip')return 'Trip'+(w.name?': '+w.name:'')+' · mobility only';return ''}
function planBlocks(){planItems();const out=[];(PLANC.weeks||[]).forEach(w=>{const l=out[out.length-1];if(l&&l.t===w.t&&l.name===w.name&&!w.manual===!l.manual){l.end=addD(w.mon,6);l.k1=w.k}else out.push({t:w.t,name:w.name,manual:w.manual,start:w.mon,end:addD(w.mon,6),k0:w.k,k1:w.k})});

function planCard(){const bl=planBlocks();

function timelineHtml(){const y0=new Date(CALY+'-01-01T12:00:00'),n=((CALY%4===0&&CALY%100!==0)||CALY%400===0)?366:365;const pos=d=>Math.max(0,Math.min(n,Math.round((new Date(d+'T12:00:00')-y0)/864e5)));

 `<div class="bmleg"><span>less</span><i style="background:linear-gradient(90deg,${RAMP.join(',')})"></i><span>more</span></div><div class="small muted bmsub">${tot>0?Math.round(tot)+' weighted sets in this '+(BM.mode==='day'?'day':'week'):'Nothing logged for this '+(BM.mode==='day'?'day':'week')+' yet. Tick set circles in a session and the muscles light up.'}</div>
 <h3 class="bmh">${since==null?'Days since trained':(since===0?'You trained today':since+' day'+(since===1?'':'s')+' since your last workout')}</h3><div class="chips">${CHIPS.map(c=>{const d=days(c[0]),cc=chipCol(d);return `<span class="chp ${cc[1]==='never'?'nv':''}" style="background:${cc[0]}"><b>${c[0]}</b><small>${cc[1]}</small></span>`}).join('')}</div></div>`;
 h+=`<div class="card rgc"><h2>Weekly set targets</h2><div class="rgs">${GRP.map(g=>ring(W.g[g[0]]||0,tg[g[0]],cols[g[0]],g[1])).join('')}</div><button class="lnkb" id="tgEdit">Edit targets</button><div class="tgform" id="tgForm" hidden>${GRP.map(g=>`<label class="field"><span>${g[1]}</span><input type="number" inputmode="numeric" min="1" max="99" data-tg="${g[0]}" value="${tg[g[0]]}"></label>`).join('')}</div></div>`;
 const rs=recStore();const rows=Object.entries(rs).filter(([k,v])=>v.hist&&v.hist.length).map(([k,v])=>({k,v,d:v.best.date||''})).sort((a,b)=>b.d.localeCompare(a.d)).slice(0,4);
 h+=`<div class="card rcc"><h2>Strength records</h2>${rows.length?rows.map(r=>`<button class="rrow" data-rec="${esc(r.k)}"><span>${esc(r.k)}</span><b>${r.v.best.kg} kg</b><small>est. 1RM ${Math.round(r.v.best.e1)} kg</small></button>`).join(''):'<div class="small muted">Log a weight on a lift and your best is tracked here. A new best shows a trophy.</div>'}</div>`;
 return h}
function foldGet(){try{return JSON.parse(localStorage.getItem('trn.fold')||'{}')}catch(e){return{}}}
function foldWire(){const F=foldGet();[['bmc','bm'],['rgc','rg'],['rcc','rc']].forEach(([c,k])=>{const card=$('main').querySelector('.'+c);if(!card)return;const h2=card.querySelector('h2');if(!h2)return;card.classList.add('fold');const body=document.createElement('div');body.className='fb';while(h2.nextSibling)body.appendChild(h2.nextSibling);card.appendChild(body);
 const btn=document.createElement('button');btn.type='button';btn.className='chev2';btn.setAttribute('aria-label','Fold or unfold');btn.textContent='▾';card.appendChild(btn);
 const set=on=>{card.classList.toggle('closed',on);btn.setAttribute('aria-expanded',on?'false':'true')};set(!!F[k]);
 const tog=()=>{const o=!card.classList.contains('closed');set(o);const G2=foldGet();G2[k]=o;try{localStorage.setItem('trn.fold',JSON.stringify(G2))}catch(e){}};btn.onclick=tog;h2.style.cursor='pointer';h2.onclick=tog})}
function wire(){const m=$('main');foldWire();
 m.querySelectorAll('[data-bm]').forEach(b=>b.onclick=()=>{BM.mode=b.dataset.bm;BM.off=0;renderHome()});
 m.querySelectorAll('[data-bo]').forEach(b=>b.onclick=()=>{BM.off=Math.min(0,BM.off+(+b.dataset.bo));renderHome()});
 const te=$('tgEdit');if(te)te.onclick=()=>{const f=$('tgForm');f.hidden=!f.hidden};
 m.querySelectorAll('[data-tg]').forEach(i=>i.onchange=()=>{G.targets=G.targets||{};const v=Math.max(1,Math.min(99,parseInt(i.value)||1));G.targets[i.dataset.tg]=v;saveG();renderHome();const f=$('tgForm');if(f)f.hidden=false});
 m.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>recChart(b.dataset.rec))}
function recChart(k){const v=recStore()[k];if(!v)return;const p=v.hist.slice(-30);const ys=p.map(x=>x.e1);const lo=Math.min(...ys),hi=Math.max(...ys),pad=Math.max(2.5,(hi-lo)*.3);
 $('progPanel').innerHTML=`<h2>${esc(k)}</h2><div class="card"><div class="minih"><span>Estimated 1RM (kg)</span><span class="muted">${Math.round(v.best.e1)} best</span></div>${svgChart({h:140,ymin:Math.floor(lo-pad),ymax:Math.ceil(hi+pad),yt:[Math.floor(lo-pad),Math.ceil(hi+pad)],xn:p.length,xl:p.map((x,i)=>(i===0||i===p.length-1)?x.d.slice(5):''),lines:[{c:'#2b8f91',p:ys.map(y=>y),lab:y=>Math.round(y)}]})}<div class="small muted">Est. 1RM = kg × (1 + reps ÷ 30), using the planned reps of that set. A guide, not a test.</div></div><button class="btn" id="closeProg">Close</button>`;
 $('closeProg').onclick=()=>closeSheet('sheetProg');openSheet('sheetProg')}
const _rh=renderHome;renderHome=function(){_rh();try{const s=[...$('main').querySelectorAll('.sec0')].find(x=>/your programs/i.test(x.textContent)&&x.parentNode===$('main'));if(s){const d=document.createElement('div');d.id='v20';d.innerHTML=html();s.parentNode.insertBefore(d,s);wire()}}catch(e){console.error(e)}};
// ---- records
function repsOf(it,wi){try{const m=/[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/.exec(specText(it,wi).main||'');if(m)return m[2]?(+m[1]+ +m[2])/2:+m[1]}catch(e){}return 5}
function toast(t,sub){let el=document.getElementById('prT');if(!el){el=document.createElement('div');el.id='prT';document.body.appendChild(el)}el.innerHTML=`<span class="trophy">🏆</span><div><b>${esc(t)}</b><small>${esc(sub)}</small></div>`;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),4200)}
document.addEventListener('change',e=>{const inp=e.target;if(!inp||!inp.classList||!inp.classList.contains('kg'))return;const card=inp.closest('.ex');if(!card||!card.dataset.k)return;
 try{const a=card.dataset.k.split('|');const wi=+a[0],id=a.slice(1).join('|');let it=null;PLAN.sessions.forEach(s=>s.items.forEach(x=>{if(x.id===id)it=x}));if(!it||it.t!=='ex')return;
  const key=wi+'|'+id;const nm=(S.swap&&S.swap[key])?S.swap[key].name:it.name;const title=parseName(nm).title;const kg=parseFloat(String(inp.value).replace(',','.'));if(!(kg>0)||SKIP.test(title.toLowerCase())||/carry|sled|drag|jump|hop|bound|push-up|plank/i.test(title)&&!hasKg(it))return;
  const r=repsOf(it,wi),e1=kg*(1+r/30),d=ymd(new Date());const st=recStore();const cur=st[title];
  if(!cur){st[title]={best:{kg,e1,date:d},hist:[{d,kg,e1}]};recSave(st);return}
  const last=cur.hist[cur.hist.length-1];if(last&&last.d===d){last.kg=kg;last.e1=e1}else cur.hist.push({d,kg,e1});
  if(e1>cur.best.e1+.01){cur.best={kg,e1,date:d};recSave(st);toast('New strength record!',title+' · '+kg+' kg · est. 1RM '+Math.round(e1)+' kg')}else{recSave(st)}}catch(err){console.error(err)}},true);
// baseline from existing logs (silent, once)
try{if(!localStorage.getItem('trn.pr')){const st={};MPROGS.forEach(id=>{const s2=getState(id),P=PROGS[id];Object.entries(s2.kg||{}).forEach(([key,val])=>{const kg=parseFloat(String(val).replace(',','.'));if(!(kg>0))return;const a=key.split('|'),wi=+a[0],iid=a.slice(1).join('|');let it=null;P.sessions.forEach(s=>s.items.forEach(x=>{if(x.id===iid)it=x}));if(!it)return;const title=parseName((s2.swap&&s2.swap[key])?s2.swap[key].name:it.name).title;if(SKIP.test(title.toLowerCase()))return;let r=5;try{const m=/[×x]\s*(\d+)(?:\s*[–-]\s*(\d+))?/.exec(specText(it,wi).main||'');if(m)r=m[2]?(+m[1]+ +m[2])/2:+m[1]}catch(e){}const e1=kg*(1+r/30);const d=ymd(new Date());if(!st[title])st[title]={best:{kg,e1,date:d},hist:[{d,kg,e1}]};else if(e1>st[title].best.e1){st[title].best={kg,e1,date:d};st[title].hist=[{d,kg,e1}]}})});if(Object.keys(st).length)recSave(st)}}catch(e){}
})();
/*END V20*/

/*V19d hr tokens*/
function hrWalk(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())if(w.currentNode.nodeValue.indexOf('{')>=0)ns.push(w.currentNode);ns.forEach(n=>{n.nodeValue=hrTok(n.nodeValue)});root.querySelectorAll('[placeholder*="{"]').forEach(e=>e.placeholder=hrTok(e.placeholder))}
const _rm2=renderMain;renderMain=function(){_rm2();hrWalk($('main'));if(PLAN.id==='cardio'){const ci=document.getElementById('zMeth');}};
const _ri2=renderInfo;renderInfo=function(){_ri2();hrWalk($('main'));if(PLAN.id==='cardio'){const t=document.createElement('div');t.innerHTML=cardioInfo();$('main').prepend(...t.children);cardioWire()}};
/*END V19d*/

renderAll();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
