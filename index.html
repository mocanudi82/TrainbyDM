 --bg:#eef3f1;--bg0:#eef3f1;--dm:0%;--card:#ffffff;--ink:#222a2a;--muted:#5d6f6f;--line:#222a2a;--shadow:#222a2a;
 --accent:#ec4624;--accent-t:#c93a1c;--accent-ink:#fbf3e1;--accent-soft:#f6cdbf;--ok:#222a2a;--ok-soft:#d3ecec;--warn:#8a5a00;--warn-soft:#f8de9a;--bad:#b8321c;--bad-soft:#f6cdbf;
 --chip:#dfe9e6;--s1:#222a2a;--s2:#ec4624;--s3:#f39120;--s4:#f1e6cf;--c-or:#ec4624;--c-te:#222a2a;--c-la:#f39120;--c-ye:#f39120;--c-na:#151515;
 --fh:"Oswald","Arial Narrow",Impact,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2e3a3a;--bg0:#2e3a3a;--dm:0%;--card:#3a4848;--ink:#e2dac2;--muted:#aebfbc;--line:#e2dac2;--shadow:#e2dac2;--accent-t:#ff8a6a;--ok:#e2dac2;--ok-soft:#2f5a5a;--chip:#465757;--warn:#f39120;--warn-soft:#5a4416;--bad:#ff9a84;--bad-soft:#5c2c22;--s1:#e2dac2;--s4:#4fbbbc}}
:root[data-theme="dark"]{--bg:#2e3a3a;--bg0:#2e3a3a;--dm:0%;--card:#3a4848;--ink:#e2dac2;--muted:#aebfbc;--line:#e2dac2;--shadow:#e2dac2;--accent-t:#ff8a6a;--ok:#e2dac2;--ok-soft:#2f5a5a;--chip:#465757;--warn:#f39120;--warn-soft:#5a4416;--bad:#ff9a84;--bad-soft:#5c2c22;--s1:#e2dac2;--s4:#4fbbbc}
body{line-height:1.3;font-size:15px}
h1,h2,.sess-title,.sec,.tab,.wk b,.btn,.links button,.links a,.low,.skip,.opt,.minih,.pbar label,.tmr .l{font-family:var(--fh);letter-spacing:.6px;text-transform:uppercase}
h1{font-size:30px;line-height:.95;font-weight:700;color:var(--ink);white-space:normal;letter-spacing:.5px}
h1::before{content:""}
.sub{display:inline-block;margin-top:5px;background:var(--red);color:#fbf3e1;font-family:var(--fh);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 8px}
header.top::after{height:10px;border-radius:0;background:linear-gradient(90deg,var(--red) 0 33%,var(--yel) 33% 66%,var(--brn) 66%)}
.iconbtn{background:var(--brn);color:var(--yel);border:0;border-radius:0}
.wk{border-radius:0;border:2px solid var(--ink);background:var(--card)}
.wk[data-w="0"],.wk[data-w="3"]{--tc:var(--red)}.wk[data-w="1"],.wk[data-w="4"]{--tc:var(--yel)}.wk[data-w="2"]{--tc:#e9a58f}
.wk,.tab{background:color-mix(in srgb,var(--tc) 30%,var(--card))}
.wk.on,.tab.on{background:var(--tc);color:#222a2a}
.tab{border-radius:0;border:2px solid var(--ink)}
.tab[data-s="D1"]{--tc:var(--red)}.tab[data-s="D2"]{--tc:var(--yel)}.tab[data-s="D3"]{--tc:#e9a58f}.tab[data-s="D4"]{--tc:#d9c79f}
.tab.on{color:#fbf3e1}.tab[data-s="D2"].on,.tab[data-s="D4"].on,.tab[data-s="D3"].on{color:#222a2a}
.bar{height:8px;border-radius:0;border:2px solid var(--ink);background:var(--card)}.bar i{background:var(--red)}
.sess-title{font-size:26px;line-height:1;font-weight:700;color:var(--ink);letter-spacing:.4px;margin:16px 0 4px;text-wrap:balance}
.sess-title::after{content:"";display:block;height:5px;width:64px;background:var(--red);margin-top:7px}
.sess-meta{font-size:12.5px;border-left:4px solid var(--yel);padding-left:8px}
.blk{background:none;border:0;padding:0;margin:20px 0 0;border-radius:0}
.blk .sec{margin:0 0 6px;display:flex;align-items:center}
.blk .sec>span:first-child{background:var(--brn);color:var(--yel);padding:5px 10px;border-radius:0;font-size:14px;line-height:1.15;letter-spacing:.8px}
.blk.alt .sec>span:first-child{background:var(--red);color:#fbf3e1}
.blk .sec .cnt{font-family:var(--fm);color:var(--ink)}
.ex,.card{border-radius:0;border:2px solid var(--ink);background:var(--card);box-shadow:none}
.blk .ex{background:var(--card)}
.ex .nm{font-family:var(--fh);text-transform:uppercase;font-size:18px;letter-spacing:.3px;font-weight:700;line-height:1.1}
.num,.blk .num{border-radius:0;background:var(--yel);color:#222a2a;border:0}
.blk.alt .num{background:var(--red);color:#fbf3e1}
.spec b{font-size:19px}
.set{border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.set.on{border-color:var(--blk);color:#fbf3e1;background:radial-gradient(circle,var(--red) 0 27%,transparent 28%),repeating-radial-gradient(circle,#151515 0 2px,#2e2e2e 2px 3px)}
.ex.done{background:var(--ok-soft)!important}
.links button,.links a{border-radius:0;background:var(--chip);color:var(--ink);font-size:13px;padding:4px 10px}
.links [data-plt]{background:var(--chip)}.links [data-note]{background:var(--yel)}.links [data-edit]{background:var(--chip)}.links [data-swap]{background:var(--chip)}.links a{background:var(--chip)}
.links [data-tm]{background:var(--red);color:#fbf3e1}
.btn{border-radius:0;background:var(--brn);color:var(--yel);border:0}
.btn.alt{background:var(--chip);color:var(--ink)}
.low{border-radius:0;background:var(--yel);color:#222a2a}.low.hot{background:var(--red);color:#fbf3e1}
.opt{border-radius:0;background:var(--yel);color:#222a2a}
.kg,.tjh,.tjt input,.field input,textarea{border-radius:0;border:2px solid var(--ink);background:var(--card)}
.tjt{background:var(--warn-soft);border-radius:0}
.note{background:var(--chip);border-radius:0;border-left:4px solid var(--red)}
.pbar{background:var(--brn)!important;border-top:0}
.pbar label{color:var(--yel)}
.pbar button,.pbar button[data-p]{background:var(--yel)!important;color:#222a2a;border:0;border-radius:0;aspect-ratio:auto;height:36px}
.pbar button.on,.pbar button.on[data-p]{background:var(--red)!important;color:#fbf3e1}
.tmr{background:var(--blk);color:var(--yel);border:2px solid var(--red);border-radius:0}
.tmr button{border-radius:0;background:var(--yel);color:#222a2a}
.sclk button{background:var(--red);color:#fbf3e1;border-radius:0}
.banner{border-radius:0;border:2px solid var(--red)}
.mq{background:var(--warn-soft);border-color:var(--ink)}
.mq .mrow button{border-radius:0;background:var(--yel)}
.panel{border-radius:0;border-top:6px solid var(--red)}
.card h2{border-bottom:4px solid var(--red);font-size:20px}
.swit.on{background:var(--yel)}

/* ===== B2 refinements ===== */
.blk{border:3px solid var(--ink);padding:0 8px 6px;margin:22px 0 0;background:color-mix(in srgb,var(--yel) 14%,var(--bg))}
.blk.alt{background:color-mix(in srgb,var(--red) 10%,var(--bg))}
.blk .sec{margin:0 -8px 8px;gap:0}
.blk .sec>span:first-child{flex:1;padding:6px 10px}
.blk .sec .cnt{background:var(--ink);color:var(--yel);padding:0 10px;align-self:stretch;display:flex;align-items:center;margin-left:0;font-size:13px}
.blk .ex{border-width:1px 1px 1px 8px}

.mast{display:flex;justify-content:space-between;font-family:var(--fm);font-size:10.5px;letter-spacing:1px;text-transform:uppercase;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);padding:3px 0;margin-bottom:8px;color:var(--ink)}
#main{counter-reset:trk}
.blk{counter-increment:trk}
.blk .sec>span:first-child::before{content:"Block " counter(trk,decimal-leading-zero);display:block;font-family:var(--fm);font-size:9.5px;letter-spacing:1.4px;opacity:.8;margin-bottom:1px}
.spec b{display:inline-block;background:var(--yel);color:#222a2a;padding:0 9px;transform:rotate(-2deg);border:2px solid var(--ink);font-size:20px;line-height:1.25}
.spec{align-items:center;gap:8px 12px}
.ex{border-left:8px solid var(--bc,var(--red))}
.blk.alt .ex{border-left-color:var(--red)}.blk:not(.alt) .ex{border-left-color:var(--brn)}
.ex .nm{font-size:19px}
.sess-meta{font-family:var(--fm);font-size:11px;letter-spacing:.3px}
.sess-title{font-size:30px}
.bar{height:12px;position:relative;overflow:visible}.bar i{position:relative;background:repeating-linear-gradient(90deg,var(--red) 0 10px,#c93a1c 10px 12px)}
.bar i::after{content:"";position:absolute;right:-9px;top:-5px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--red) 0 28%,transparent 30%),repeating-radial-gradient(circle,#151515 0 1.5px,#2e2e2e 1.5px 2.5px);border:1px solid #151515}
.pbar button[data-p="0"],.pbar button[data-p="1"],.pbar button[data-p="2"],.pbar button[data-p="3"]{background:#f39120!important}
.pbar button[data-p="4"],.pbar button[data-p="5"]{background:#f39120!important}
.pbar button[data-p="6"],.pbar button[data-p="7"],.pbar button[data-p="8"],.pbar button[data-p="9"],.pbar button[data-p="10"]{background:#ec4624!important;color:#fbf3e1}
.pbar button.on,.pbar button.on[data-p]{outline:3px solid #fbf3e1;outline-offset:-3px;background:#151515!important;color:#f39120}
.tmr{overflow:visible;padding-left:84px;min-height:92px}
.tmr::before{content:"";position:absolute;left:12px;top:50%;margin-top:-30px;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle,#151515 0 4%,var(--red) 5% 26%,transparent 27%),repeating-radial-gradient(circle,#151515 0 2px,#2e2e2e 2px 3px);border:2px solid #444}
.tmr.go::before{animation:spin 2.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tmr .big{font-family:var(--fm);color:var(--yel)}
#finBtn{display:block;width:100%;background:var(--red);color:#fbf3e1;font-size:18px;padding:13px;margin:16px 0 6px;letter-spacing:1px;text-align:center}
#resetSess{display:block;width:100%;text-align:center}
.card h2::before{content:"★ ";color:var(--red)}
.hist details{border-bottom:2px solid var(--ink)}
.add .btn{background:var(--brn);color:var(--yel)}
.links{border-top:1px dashed var(--ink);padding-top:8px}
.links button,.links a{border:1px solid var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mast{border-color:var(--ink)}:root:not([data-theme="light"]) .spec b{color:#222a2a}}

/* ===== B3: disco title ===== */
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand h1{margin:0;line-height:.8;padding:0 14px 10px 0}
.ski{display:block;font-family:var(--fh);font-weight:700;font-size:68px;line-height:.8;letter-spacing:1px;color:var(--ink);
 text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 var(--brn)}
.bt{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}
.prep{font-family:var(--fh);font-weight:700;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);border-top:3px solid var(--red);border-bottom:3px solid var(--yel);padding:2px 0;line-height:1.1}
.bt .sub{margin:0;font-size:10.5px;padding:2px 6px;letter-spacing:.8px}
.iconbtn{width:32px;height:32px;font-size:16px}
.row{gap:6px}
.sess-title{font-size:19px;line-height:1.1;margin:14px 0 4px;letter-spacing:.5px}
.sess-title::after{height:4px;width:44px;margin-top:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{color:#f6ecd6;text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 #8a2f1e}}
:root[data-theme="dark"] .ski{color:#f6ecd6;text-shadow:3px 3px 0 var(--yel),6px 6px 0 #f39120,9px 9px 0 var(--red),12px 12px 0 #8a2f1e}

.mast{align-items:center;padding:4px 0}
.mast .mt{display:flex;flex-direction:column;gap:2px}
.mast .mi{display:flex;gap:6px}
.mast .iconbtn{width:34px;height:34px}
.bt .sub{white-space:nowrap}
.brand{gap:14px}

/* ===== C: Iron / Aqua / Rust ===== */
:root{--aq:#4fbbbc;--cr:#e2dac2}
.sub{background:var(--aq);color:#222a2a}
header.top::after{background:linear-gradient(90deg,#ec4624 0 25%,#f39120 25% 50%,#4fbbbc 50% 75%,#222a2a 75%)}
.ski{text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #222a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{color:#e2dac2;text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #e2dac2}}
:root[data-theme="dark"] .ski{color:#e2dac2;text-shadow:3px 3px 0 #4fbbbc,6px 6px 0 #f39120,9px 9px 0 #ec4624,12px 12px 0 #e2dac2}
.prep{border-top-color:#ec4624;border-bottom-color:#4fbbbc}
.wk[data-w="0"]{--tc:#4fbbbc}.wk[data-w="1"]{--tc:#f39120}.wk[data-w="2"]{--tc:#ec4624}.wk[data-w="3"]{--tc:#e2dac2}.wk[data-w="4"]{--tc:#4fbbbc}
.tab[data-s="D1"]{--tc:#ec4624}.tab[data-s="D2"]{--tc:#f39120}.tab[data-s="D3"]{--tc:#4fbbbc}.tab[data-s="D4"]{--tc:#e2dac2}
.wk.on,.tab.on{color:#222a2a}.tab[data-s="D1"].on{color:#fff}
.sess-title::after{background:#ec4624}
.sess-meta{border-left-color:#4fbbbc}
.blk{background:color-mix(in srgb,#f39120 12%,var(--bg))}
.blk.alt{background:color-mix(in srgb,#4fbbbc 16%,var(--bg))}
.blk .sec>span:first-child{background:#222a2a;color:#f39120}
.blk.alt .sec>span:first-child{background:#4fbbbc;color:#222a2a}
.blk .sec .cnt{background:#222a2a;color:#e2dac2}
.blk .num{background:#f39120;color:#222a2a}.blk.alt .num{background:#4fbbbc;color:#222a2a}
.blk .ex{border-left-color:#222a2a}.blk.alt .ex{border-left-color:#4fbbbc}
.spec b{background:#e2dac2;color:#222a2a}
.links [data-note]{background:#4fbbbc;color:#222a2a}.links [data-tm]{background:#ec4624;color:#fff}
.tjt{background:#e2dac2}.note{background:#e2dac2;border-left-color:#4fbbbc}
.low{background:#e2dac2;color:#222a2a}.low.hot{background:#ec4624;color:#fff}
.opt{background:#4fbbbc;color:#222a2a}
.pbar{background:#222a2a!important}
.pbar button[data-p="0"],.pbar button[data-p="1"],.pbar button[data-p="2"],.pbar button[data-p="3"]{background:#4fbbbc!important;color:#222a2a}
.pbar button[data-p="4"],.pbar button[data-p="5"]{background:#f39120!important;color:#222a2a}
.pbar button[data-p="6"],.pbar button[data-p="7"],.pbar button[data-p="8"],.pbar button[data-p="9"],.pbar button[data-p="10"]{background:#ec4624!important;color:#fff}
.pbar button.on,.pbar button.on[data-p]{background:#e2dac2!important;color:#222a2a;outline:3px solid #222a2a;outline-offset:-3px}
.pbar label{color:#f39120}
.tmr{background:#222a2a;color:#f39120;border-color:#4fbbbc}
.tmr .big{color:#4fbbbc}.tmr.go .big{color:#4fbbbc}
.btn{background:#222a2a;color:#f39120}
#finBtn{background:#ec4624;color:#fff}
.sclk button{background:#ec4624;color:#fff}
.card h2{border-bottom-color:#4fbbbc}.card h2::before{color:#ec4624}
.ex.done{background:#d3ecec!important}
.mq{background:#e2dac2}.iconbtn{background:#222a2a;color:#f39120}

/* ===== compact header + SKI TRAINING ===== */
:root{--e1:#4fbbbc;--e2:#f39120;--e3:#ec4624;--e4:#222a2a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--e4:#e2dac2}}
:root[data-theme="dark"]{--e4:#e2dac2}
.mast{border-top:0;border-bottom:1px solid var(--ink);padding:2px 0 4px;margin-bottom:4px;font-size:9.5px;letter-spacing:.8px}
.mast .mt{flex-direction:row;gap:10px;flex-wrap:wrap}
.mast .iconbtn{width:28px;height:28px;font-size:14px}
.mast .mi{gap:4px}
.brand{display:block}
.brand h1{padding:0 8px 8px 0;margin:2px 0 0;line-height:.9}
.ski{font-size:36px;line-height:.9;letter-spacing:1px;text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ski{text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}}
:root[data-theme="dark"] .ski{text-shadow:2px 2px 0 var(--e1),4px 4px 0 var(--e2),6px 6px 0 var(--e3),8px 8px 0 var(--e4)}
.bt2{display:flex;gap:6px;margin-top:2px}
.bt2 .sub{margin:0;font-size:9.5px;padding:1px 6px;letter-spacing:.8px;background:#4fbbbc;color:#222a2a;white-space:nowrap}
header.top{padding:6px 0 4px}
header.top::after{height:6px;margin-top:6px}
.scroller{padding:4px 0 0;gap:6px}
.wk{padding:3px 8px;min-width:56px;border-width:2px}
.wk b{font-size:14px}.wk span{font-size:10px}
.tabs{padding-top:5px;gap:5px}
.tab{padding:3px 4px;font-size:14px}.tab small{font-size:9.5px}
.bar{height:9px;margin-top:6px}
.bar i::after{width:14px;height:14px;top:-3px;right:-7px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex.done{background:#2f5a5a!important}:root:not([data-theme="light"]) .tjt,:root:not([data-theme="light"]) .note{background:#465757}:root:not([data-theme="light"]) .spec b{background:#e2dac2}}
:root[data-theme="dark"] .ex.done{background:#2f5a5a!important}:root[data-theme="dark"] .tjt,:root[data-theme="dark"] .note{background:#465757}

/* ===== rounder shapes ===== */
.iconbtn,.mast .iconbtn{border-radius:50%}
.wk,.tab{border-radius:16px}
.bar{border-radius:999px}.bar i{border-radius:999px}
.sub,.bt2 .sub,.opt,.low,.skip{border-radius:999px}
.blk{border-radius:22px;overflow:hidden}
.blk .sec>span:first-child{border-radius:0}
.ex,.card{border-radius:18px}
.blk .ex{border-radius:16px}
.num,.blk .num{border-radius:50%}
.spec b{border-radius:12px}
.links button,.links a{border-radius:999px}
.btn,#finBtn,.sclk button{border-radius:999px}
.kg,.tjh,.tjt input,.field input,textarea,.field textarea{border-radius:12px}
.tjt,.note{border-radius:14px}
.pbar{border-radius:20px 20px 0 0}
.pbar button,.pbar button[data-p]{border-radius:50%;aspect-ratio:1/1;height:auto;max-height:36px;flex:1}
.tmr{border-radius:22px}.tmr button{border-radius:999px}
.banner,.mq{border-radius:16px}.mq .mrow button{border-radius:10px}
.panel{border-radius:24px 24px 0 0}
.swlist,.lib{border-radius:14px}
.ski{border-radius:0}
header.top::after{border-radius:999px}
.mast{border-radius:0}

.brand{display:flex;align-items:center;gap:12px}
.bt2{flex-direction:column;align-items:flex-start;gap:4px;margin:0 0 8px}
.ski{font-size:clamp(24px,8.6vw,36px);white-space:nowrap}
.brand{min-width:0}
.bt2{gap:6px;margin:0 6px 10px 0}
.bt2 .sub{background:none!important;color:var(--ink)!important;font-family:var(--fh);font-weight:700;font-size:clamp(11px,3.7vw,15px);line-height:1;letter-spacing:.8px;padding:0;border-radius:0;text-transform:uppercase;text-shadow:1px 1px 0 var(--e1),2px 2px 0 var(--e2),3px 3px 0 var(--e3),4px 4px 0 var(--e4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bt2 .sub{color:#e2dac2!important}}
:root[data-theme="dark"] .bt2 .sub{color:#e2dac2!important}
/* no drop shadows anywhere (the title's multi-line echo is kept) */
*,*::before,*::after{box-shadow:none!important}
.tmr,.panel,.sheet .panel{box-shadow:none!important;filter:none}

/* ===== D layer: one-shade progress chips, static header, compact, no tints ===== */
header.top{position:static!important}
body::before{display:none!important}
.wk,.tab{--c0:#e3f2f2;--c1:#c3e5e6;--c2:#93d1d2;--c3:#4fbbbc;--c4:#2b8f91;border:2px solid transparent!important;color:#222a2a}
.wk.l0,.tab.l0{background:var(--c0)!important}.wk.l1,.tab.l1{background:var(--c1)!important}.wk.l2,.tab.l2{background:var(--c2)!important}.wk.l3,.tab.l3{background:var(--c3)!important}
.wk.l4,.tab.l4{background:var(--c4)!important;color:#fff}
.wk span,.tab small{color:inherit!important;opacity:.8}

.symc .symn.ok{color:#2b8f91}
.symg{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px 8px;align-items:center;margin-top:8px}
.symg>b{text-align:center;font-family:var(--fh);letter-spacing:.8px;text-transform:uppercase;font-size:13px;color:var(--muted)}
.symg .syml{font-size:14px;line-height:1.2}.symg .syml small{display:block;color:var(--muted);font-size:12px}
.symg input{width:100%;min-width:0;text-align:center;font-size:18px;padding:8px 4px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
/* cardio */
.cnew .cmodes{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cnew .cmodes button,.cqq button,.tcar .cmodes button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px}
.cnew .cmodes button.on,.cqq button.on,.tcar .cmodes button.on{background:#2b8f91;border-color:#2b8f91;color:#fff}
.cqq{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.czl{font-size:14px;color:var(--muted);margin:6px 0}
.copt-h{font-family:var(--fh);letter-spacing:.8px;text-transform:uppercase;font-size:13px;color:var(--muted);margin:10px 0 6px}
.copt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 12px;margin:0 0 8px;transition:border-color .2s,background .2s,transform .15s}
.copt b{display:block;font-size:16px}.copt span{display:block;font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.copt.on{border-color:#2b8f91;background:rgba(79,187,188,.14)}
.copt:active{transform:scale(.985)}
.cdone{width:100%;margin:8px 0 0;text-align:center}.cdone.on{background:#2b8f91;color:#fff}
.tcar h2{margin:0 0 6px}
/* calendar */
.ctitle{display:inline-block}
.ysw .ctitle{font-size:30px!important;margin:0}
.cnav .ctitle{display:block;margin:0;font-size:24px!important}
.tl2{margin-top:3px;height:9px}
.tl2 i{height:100%;border-radius:3px}
.tlg{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 2px;font-size:12px;color:var(--muted)}
.tlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ctr[data-t]{border-left:5px solid var(--tk,#999)}
/* fitbod extras */
.wup{font-size:13px;color:var(--muted);margin:6px 0 2px}.wup b{font-family:var(--fh);letter-spacing:.8px;text-transform:uppercase;color:var(--ink);margin-right:4px}
.ex.cfin{opacity:.78}
.sumh{font-family:var(--fh);font-size:30px;letter-spacing:1px;text-transform:uppercase;color:#f39120}
.sumg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.sumg div{background:var(--card);border:2px solid var(--line);border-radius:14px;text-align:center;padding:10px 4px}
.sumg b{display:block;font-family:var(--fh);font-size:28px;line-height:1.1}.sumg small{font-size:12px;color:var(--muted)}
/* motion */
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sup{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes popset{0%{transform:scale(.6)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes cpulse{0%{box-shadow:0 0 0 0 rgba(79,187,188,.55)}100%{box-shadow:0 0 0 14px rgba(79,187,188,0)}}
@keyframes tring{from{stroke-dashoffset:0}to{stroke-dashoffset:56.55}}
.sheet.on{animation:fadein .2s ease both}
.sheet.on .panel{animation:sup .3s cubic-bezier(.2,.8,.2,1) both}
.set.pop{animation:popset .35s cubic-bezier(.2,.8,.2,1)}
.ex.cpulse{animation:cpulse .7s ease-out}
.ex[data-k]{transition:transform .2s ease,opacity .3s}
#main .pbar2 i,#main .cbar i.cb,#main .tl i,#main .tl2 i{transform-origin:left;animation:growx .75s cubic-bezier(.2,.8,.2,1) both}
.tring{position:absolute;right:12px;top:9px;transform:rotate(-90deg)}
.tring circle{fill:none;stroke-width:3}.tring .tb{stroke:currentColor;opacity:.25}.tring .tf{stroke:currentColor;stroke-dasharray:56.55}
.chev{display:inline-block;transition:transform .25s}
.blk.folded .chev{transform:rotate(-90deg)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- V22 ---- */
html{background-color:#d8f0ef}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background-color:#10302f}}
html[data-theme="dark"]{background-color:#10302f}
.vsub{font-size:.62em;position:relative;top:.28em;line-height:0;margin-left:1px}
.pdn{font-size:.5em;margin-left:1px;vertical-align:baseline;position:relative;top:.3em}
.pcard{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .2s,box-shadow .2s}
.pcard.drag{position:relative;z-index:50;transition:none;box-shadow:0 14px 34px rgba(0,0,0,.28)!important;opacity:.96}
.pcard.swapt{outline:3px dashed #f39120;outline-offset:2px}
.pbw{position:relative;overflow:hidden;border-radius:22px;margin:6px 0}
.pbw .pbk{position:relative;z-index:1;width:100%;margin:0!important;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.pbw .dbtn{position:absolute;right:0;top:0;bottom:0;width:92px;border:0;background:#d6342a;color:#fff;font-family:var(--fh);letter-spacing:.8px;text-transform:uppercase;font-size:15px;border-radius:0 22px 22px 0}
.pbw .dbtn{visibility:hidden}.pbw.rev .dbtn,.pbw.swp .dbtn{visibility:visible}
.pbw .dbtn[disabled]{opacity:.35}
.pbw.rev .pbk{transform:translateX(-92px)}
.tl i.tkb{top:4px;bottom:4px;border-radius:5px;box-shadow:0 0 0 1.5px var(--sg-card,#fff)}
.cyr{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rpick{background:var(--sg-card,var(--card));border:1px solid var(--sg-line,var(--line));border-radius:16px;padding:10px;margin-bottom:8px}
.rpt{font-family:var(--fh);font-size:20px;letter-spacing:.6px;margin-bottom:2px}
.rpn{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
.rpn button{width:34px;height:34px;border-radius:50%;border:0;background:var(--sg-chip,var(--chip));font-size:20px;color:var(--ink)}
.rpg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.rpg .rw{font-style:normal;text-align:center;font-size:12px;color:var(--muted)}
.rpg .rd{height:36px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:15px}
.rpg .rd.m{background:rgba(79,187,188,.28);border-radius:0}
.rpg .rd.e{background:#2b8f91;color:#fff}

.ict{display:inline-flex;align-items:baseline;line-height:1}
.nsub{font-style:normal;font-size:.55em;line-height:1;margin-left:2px;position:relative;top:.22em}
.vsub,.pdn{all:unset}
.pmid b{white-space:nowrap}

.ichips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 8px}
.ichip{font-family:var(--fh);text-transform:uppercase;letter-spacing:.8px;font-size:14px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--sg-line,#d4e6e6);background:transparent;color:inherit}
.ichip.on{background:#ec4624;border-color:#ec4624;color:#fff}

te down before stopping. Tip: Helps clear blood lactate and transitions the nervous system out of exercise mode.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"Z2-S5","n":"7","name":"Easy backstroke or breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+","mode":"Swim"},{"t":"ex","id":"Z2-S6","n":"8","name":"Shoulder & lat stretch","unit":"—","rest":"—","tempo":null,"w":[{"s":"3-4 min","kg":null}],"kind":"MOB","focus":null,"note":"Doorway pec stretch and an overhead lat stretch, 30 s each side, poolside or at home. Tip: Front crawl is a lot of internal rotation.","video":"https://www.youtube.com/results?search_query=shoulder+lat+stretch+after+swimming+","mode":"Swim"}],"modes":["Run","Bike","Swim","Row","Other"]},{"id":"VO2","tab":"VO₂","pre":"Day 2 · ","heading":"VO2max Intervals","meta":"Run, bike, swim or row · 40-50 min","opt":false,"items":[{"t":"sec","text":"The hardest day of the week. Choose ONE main set below — alternate weekly for variety."},{"t":"sec","text":"WARM-UP (10 min)"},{"t":"ex","id":"VO2-81","n":"1","name":"Easy warm-up","unit":"RPE 3-4 building to 5","rest":"—","tempo":null,"w":[{"s":"10 min","kg":null}],"kind":"AER","focus":null,"note":"5 min easy jog or spin, then A-Skips, High Knees, and 2-3 short strides to prime the legs for hard effort. Tip: Cold legs going into VO2max work is a common injury and quality-limiting mistake. Running: add A-skips, high knees and 2-3 short strides.","video":"https://www.youtube.com/results?search_query=dynamic+warm+up+drills+for+running+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"VO2-S1","n":"1","name":"Easy swim warm-up","unit":"RPE 2-3, no heart-rate range","rest":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+","mode":"Swim"},{"t":"sec","text":"MAIN SET — CHOOSE ONE"},{"t":"ex","id":"VO2-83","n":"2","name":"Norwegian 4×4 Intervals (Run)","unit":"Run: {vo:run}  |  Bike: {vo:bike}","rest":"3 min easy jog","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"4 minutes at ~90-95% max HR, 3 minutes easy jog recovery, repeat 4 times. Tip: The most evidence-backed VO2max protocol available. Effort should feel 'comfortably hard' at minute 1.","video":"https://www.youtube.com/results?search_query=norwegian+4x4+interval+training+protocol+","mode":"Run"},{"t":"ex","id":"VO2-84","n":"3","name":"4×4 Intervals (Bike alternative)","unit":"Bike: {vo:bike} or RPE 8-9/10","rest":"3 min easy spin","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"Same structure as the run version — 4 min hard, 3 min easy spin, repeat 4 times. Tip: Bike is a good lower-impact substitute on weeks where the legs are beat up from lifting.","video":"https://www.youtube.com/results?search_query=4x4+interval+training+cycling+","mode":"Bike|Row|Other"},{"t":"ex","id":"VO2-85","n":"4","name":"30/30s Intervals","unit":"Above {hrmax} during work","rest":"—","tempo":null,"w":[{"s":"10-15 × 30s hard/30s easy","kg":null}],"kind":"VO2","focus":null,"note":"30 seconds at a hard, controlled sprint effort, 30 seconds easy jog/walk, repeat 10-15 times. Tip: Shorter, more repeatable efforts than the 4×4 — good variation to manage joint load.","video":"https://www.youtube.com/results?search_query=30+30+interval+training+running+","mode":"Run"},{"t":"ex","id":"VO2-86","n":"5","name":"Hill Repeats","unit":"RPE 8-9/10 uphill","rest":"Walk/jog down","tempo":null,"w":[{"s":"8-10 × 45-60s uphill","kg":null}],"kind":"VO2","focus":null,"note":"Find a moderate 5-8% grade hill. Run hard uphill for 45-60s, walk or jog back down for full recovery. Tip: Lower impact than flat sprinting and builds power/economy alongside VO2max.","video":"https://www.youtube.com/results?search_query=hill+repeats+running+workout+","mode":"Run"},{"t":"ex","id":"VO2-S2","n":"5","name":"Short speed intervals (Swim)","unit":"RPE 8-9","rest":"30 s","tempo":null,"w":[{"s":"12-16 × 50 m","kg":null}],"kind":"VO2","focus":null,"note":"50 m fast, 30 s rest. Hold technique at speed — stop the set when the stroke breaks down. Tip: Use only if you skipped the Thursday VO2max session.","video":"https://www.youtube.com/results?search_query=swimming+50m+sprint+interval+set+","mode":"Swim"},{"t":"ex","id":"VO2-S3","n":"5","name":"4 × 4 min hard (Swim)","unit":"RPE 8-9, no heart-rate range","rest":"3 min easy","tempo":null,"w":[{"s":"4 × 4 min hard","kg":null}],"kind":"VO2","focus":null,"note":"Four minutes at a hard, controlled pace, three minutes easy swimming between. Hold technique; stop a rep early rather than let the stroke fall apart.","video":"https://www.youtube.com/results?search_query=swimming+50m+sprint+interval+set+","mode":"Swim"},{"t":"sec","text":"COOL-DOWN (10 min)"},{"t":"ex","id":"VO2-88","n":"6","name":"Easy cool-down","unit":"Below {z2lo:run}","rest":"—","tempo":null,"w":[{"s":"10 min","kg":null}],"kind":"REC","focus":null,"note":"Gradually reduce pace to an easy jog or spin, letting heart rate settle. Tip: Do not skip this after VO2max work — it meaningfully speeds recovery for the next session.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"VO2-S4","n":"7","name":"Easy backstroke or breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+","mode":"Swim"}],"modes":["Run","Bike","Swim","Row","Other"]},{"id":"TH","tab":"Threshold","pre":"Day 3 · ","heading":"Threshold / Tempo + Running Economy Drills","meta":"Run, bike, swim or row · 40-45 min","opt":false,"items":[{"t":"sec","text":"WARM-UP + RUNNING DRILLS (10-12 min)"},{"t":"ex","id":"TH-93","n":"1","name":"Easy warm-up","unit":"RPE 2-3","rest":"—","tempo":null,"w":[{"s":"5 min","kg":null}],"kind":"AER","focus":null,"note":"Easy jog or spin to raise core temperature before drill work. Tip: Keep this genuinely easy — the drills are the warm-up quality work, not this jog.","video":"https://www.youtube.com/results?search_query=easy+jog+warm+up+technique+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"TH-S1","n":"1","name":"Easy swim warm-up","unit":"RPE 2-3, no heart-rate range","rest":"—","tempo":null,"w":[{"s":"200-300 m","kg":null}],"kind":"AER","focus":null,"note":"Relaxed front crawl, breathing every 3 strokes. Stop and reset if the stroke falls apart. Tip: Swimming HR runs roughly 10-13 bpm lower than running at the same effort — judge by breathing, not the watch.","video":"https://www.youtube.com/results?search_query=freestyle+swimming+warm+up+","mode":"Swim"},{"t":"ex","id":"TH-94","n":"2","name":"A-Skip","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Skip forward driving the knee to hip height, punch the ground actively with the foot under the hip. Tip: Reinforces hip flexion timing and ground contact mechanics.","video":"https://www.youtube.com/results?search_query=A+skip+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-95","n":"3","name":"B-Skip","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Same as A-Skip but extend the leg forward and actively pull it down and back before contact. Tip: Trains the hamstring 'pawing' action that reduces overstriding.","video":"https://www.youtube.com/results?search_query=B+skip+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-96","n":"4","name":"High Knees","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Quick, tall cadence, knees driving up to hip height, minimal ground contact time. Tip: Cadence and ankle stiffness — both directly improve running economy.","video":"https://www.youtube.com/results?search_query=high+knees+running+drill+tutorial+","mode":"Run"},{"t":"ex","id":"TH-97","n":"5","name":"Butt Kicks","unit":"Bodyweight","rest":"walk back","tempo":null,"w":[{"s":"2 × 20m","kg":null}],"kind":"DRL","focus":null,"note":"Quick cadence, heels kicking up toward the glutes, minimal forward lean. Tip: Hamstring/quad cycling speed — complements the A/B skip pair.","video":"https://www.youtube.com/results?search_query=butt+kicks+running+drill+tutorial+","mode":"Run"},{"t":"sec","text":"MAIN SET — THRESHOLD"},{"t":"ex","id":"TH-99","n":"6","name":"Continuous Tempo Run","unit":"Run: {th:run}  |  Bike: {th:bike}","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Run at a pace you could sustain for about an hour if you had to — hard but controlled, not a race effort. Tip: This raises the pace you can hold before lactate accumulates.","video":"https://www.youtube.com/results?search_query=tempo+run+pacing+guide+","mode":"Run"},{"t":"ex","id":"TH-100","n":"7","name":"Sweet Spot Bike (alternative)","unit":"Bike: {th:bike} or RPE 6-7/10","rest":"—","tempo":null,"w":[{"s":"20-30 min","kg":null}],"kind":"THR","focus":null,"note":"Steady, hard-but-sustainable effort — you could speak in short sentences, not full ones. Tip: Bike sweet-spot work is a very time-efficient threshold stimulus with low joint impact.","video":"https://www.youtube.com/results?search_query=sweet+spot+training+cycling+explained+","mode":"Bike|Row|Other"},{"t":"ex","id":"TH-S2","n":"4","name":"Threshold intervals (Swim)","unit":"RPE 6-7","rest":"20-30 s","tempo":null,"w":[{"s":"8-10 × 100 m","kg":null}],"kind":"THR","focus":null,"note":"100 m at a hard-but-repeatable pace, 20-30 s rest on the wall. Every rep within 2-3 s of the first. Tip: The swim equivalent of the tempo run.","video":"https://www.youtube.com/results?search_query=swimming+100m+threshold+interval+set+","mode":"Swim"},{"t":"sec","text":"STRIDES + COOL-DOWN (8 min)"},{"t":"ex","id":"TH-102","n":"8","name":"Strides","unit":"~90-95% top speed","rest":"full walk-back","tempo":null,"w":[{"s":"6 × 100m","kg":null}],"kind":"DRL","focus":null,"note":"Gradual acceleration over the first 30m, hold near-top speed for the middle, relax off the last 20m. Tip: Not a conditioning tool — neuromuscular speed and mechanics work.","video":"https://www.youtube.com/results?search_query=running+strides+technique+tutorial+","mode":"Run"},{"t":"ex","id":"TH-103","n":"9","name":"Easy walk","unit":"Below {z2lo:run}","rest":"—","tempo":null,"w":[{"s":"3-5 min","kg":null}],"kind":"REC","focus":null,"note":"Walk it out, let heart rate settle before finishing. Tip: Closes out the session and starts the recovery clock for tomorrow.","video":"https://www.youtube.com/results?search_query=cardio+cool+down+routine+","mode":"Run|Bike|Row|Other"},{"t":"ex","id":"TH-S3","n":"7","name":"Easy backstroke or breaststroke","unit":"RPE 2","rest":"—","tempo":null,"w":[{"s":"200 m","kg":null}],"kind":"REC","focus":null,"note":"Change stroke to unload the shoulders, breathe easily, let the heart rate settle. Tip: Switching stroke takes the shoulders out of the repeated crawl pattern.","video":"https://www.youtube.com/results?search_query=backstroke+cool+down+swimming+","mode":"Swim"}],"modes":["Run","Bike","Swim","Row","Other"]}],"version":"1"},"protocol":{"id":"protocol","name":"Protocol","short":"PRO","tag":"weekly cycles and daily routine","knee":false,"info_only":true,"weeks":[{"label":"W"}],"sessions":[],"blocks":[{"title":"Repeating cycle","kind":"cards","head":["Block","Monday","Tuesday","Wednesday","Thursday","Friday","Sat / Sun"],"rows":[["Athletic Power","Session A / D","Cardio, Zone 2","Session B / E","Cardio, VO₂","Session C / F","Cardio, Zone 2 (optional: run, bike or swim)"],["Strength","Workout A","Cardio, Threshold","Workout B","Cardio, VO₂","Workout C","Cardio, Zone 2 (optional: run, bike or swim)"],["Ski Training 8 Weeks","Ski Day 1","Cardio, Zone 2","Ski Day 2","Cardio, VO₂","Ski Day 3","Saturday: Ski Day 4 (optional)"],["Ski Training 5 Weeks","Ski Day 1","Cardio, Zone 2","Ski Day 2","Cardio, VO₂","Ski Day 3","Saturday: Ski Day 4 (optional)"],["Conditioning · Fit 4 Racing (F4R)","Session 1","Cardio, Threshold","Session 2","Cardio, VO₂","Session 3","Cardio, Zone 2 (optional: run, bike or swim)"],["Cardio & VO₂ block","Cardio, Zone 2","Cardio, VO₂","Mobility or rest","Cardio, Threshold","Mobility or rest","Cardio, Zone 2 (optional: run, bike or swim)"],["Mobility","Morning, 10 min","Evening, 15 min","Knee & feet","Morning, 10 min","Evening, 15 min","Any routine you like"],["Travel Workout","Session A","Walk or rest","Session B","Walk or rest","Session C","Cardio, Zone 2 (optional: run, bike or swim)"],["Easy week","Walk and mobility","Cardio, Zone 2","Walk and mobility","Cardio, Zone 2","Walk and mobility","Cardio, Zone 2 (optional: run, bike or swim)"],["Rest","Rest","Rest","Rest","Rest","Rest","Rest"]],"links":[["athletic:A","cardio:Z2","athletic:B","cardio:VO2","athletic:C","cardio:Z2"],["strength:A","cardio:TH","strength:B","cardio:VO2","strength:C","cardio:Z2"],["ski8:D1","cardio:Z2","ski8:D2","cardio:VO2","ski8:D3","ski8:D4"],["ski:D1","cardio:Z2","ski:D2","cardio:VO2","ski:D3","ski:D4"],["conditioning:S1","cardio:TH","conditioning:S2","cardio:VO2","conditioning:S3","cardio:Z2"],["cardio:Z2","cardio:VO2","","cardio:TH","","cardio:Z2"],["mobility:AM","mobility:PM","mobility:KN","mobility:AM","mobility:PM","mobility:AM"],["nogym:A","","nogym:B","","nogym:C","cardio:Z2"],["nogym:A","","nogym:B","","nogym:C","cardio:Z2"],["","","","","","nogym:A"],["","cardio:Z2","","cardio:Z2","","cardio:Z2"],["","","","","",""]]},{"title":"Every day","kind":"lines","rows":[["Morning","10-12 min dynamic routine","Mobility sheet, Section 2. Non-negotiable — it also covers your daily ankle and hip work."],["Before every lift","The primer for that session","The WARM-UP block at the top of each session on the training sheet — different for every workout."],["Evening","15-20 min static routine","Mobility sheet, Section 3. Where all the long holds belong — lead with whatever you trained that day."]]},{"title":"Rules that keep it honest","kind":"lines","rows":[["Never stack blocks","","The ski plan replaces the A/B/C sheets and the cardio plan. It is not run in addition to them."],["Weighted pull-ups every week","","They appear in Strength Workout A and Athletic Workout C, so the lift is trained on both weeks of the cycle."],["Deloads line up","","One planned deload per 16-week cycle: Strength W5 (calendar week 9). Athletic W5 holds its W4 loads. Cut cardio interval volume by half in the Strength W5 week too."],["Hard cardio away from heavy legs","","Cardio Day 2 (VO₂) is the only genuinely hard cardio session — keep it off your heaviest lower-body day."],["Retest before re-setting loads","","After any break or the ski block, retest key lifts rather than assuming the old working weights still apply."],["Mobility is not optional","","It is the one thing that runs every single day of the year, in every block."],["Conditioning (F4R) swap","","In the Strength W5 deload week, you may swap the Thursday VO₂ cardio session for a Conditioning session — lifting volume is already reduced that week, so it is a good slot to add variety without extra fatigue."]]}],"version":"1"},"mobility":{"id":"mobility","name":"Mobility","short":"MOB","tag":"daily · 3 sessions","knee":false,"single":true,"weeks":[{"label":"W"}],"version":"1","sessions":[{"id":"AM","tab":"Morning","pre":"","heading":"Morning routine","meta":"about 10 min · 8 moves · dynamic, no long holds","opt":false,"items":[{"t":"ex","id":"AM-12","n":"1","name":"Cat–cow","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"8-10 slow","kg":null}],"kind":"Mobility","focus":null,"note":"On all fours, alternate rounding and arching the back in time with your breathing. Why: Gently mobilises the spine without loading fresh, fluid-filled discs.","video":"https://www.youtube.com/results?search_query=Cat+cow+exercise+technique"},{"t":"ex","id":"AM-13","n":"2","name":"Thoracic open-book","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Side-lying, knees stacked and bent, arms out in front. Open the top arm across and follow it with your eyes. Why: Restores overnight mid-back and rib stiffness.","video":"https://www.youtube.com/results?search_query=Thoracic+open-book+exercise+technique"},{"t":"ex","id":"AM-14","n":"3","name":"Glute bridge","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"10-12","kg":null}],"kind":"Strength","focus":null,"note":"Feet flat, drive through the heels, squeeze hard at the top for a second. Why: Wakes the glutes before they spend the day switched off.","video":"https://www.youtube.com/results?search_query=Glute+bridge+exercise+technique"},{"t":"ex","id":"AM-15","n":"4","name":"Dead bug","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"6 / side","kg":null}],"kind":"Strength","focus":null,"note":"Lower back gently pressed into the floor, lower the opposite arm and leg slowly. Why: Core switched on without any spinal flexion.","video":"https://www.youtube.com/results?search_query=Dead+bug+exercise+technique"},{"t":"ex","id":"AM-16","n":"5","name":"Hip CARs","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Standing, slow controlled hip circles with the pelvis kept still. Why: Full hip range claimed before the day shortens it.","video":"https://www.youtube.com/results?search_query=Hip+CARs+exercise+technique"},{"t":"ex","id":"AM-17","n":"6","name":"World's greatest stretch","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"3 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Long lunge, same-side elbow down towards the instep, then rotate the other arm to the ceiling. Why: Hips, mid-back and hamstrings in a single movement.","video":"https://www.youtube.com/results?search_query=World%27s+greatest+stretch+exercise+technique"},{"t":"ex","id":"AM-18","n":"7","name":"90-90 Hip Switches","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×8 slow","kg":null}],"kind":"Mobility","focus":null,"note":"Sit in 90-90, rotate to the opposite 90-90 without hands, slow and controlled. Why: Hip internal/external rotation under control. Responds to daily consistency more than any other single drill. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=90-90+Hip+Switches+exercise+technique"},{"t":"ex","id":"AM-19","n":"8","name":"Ankle Knee-to-Wall","unit":"Every morning","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Foot pointing at wall, heel down, drive the knee forward to touch. Move foot back to your limit. Why: Restores dorsiflexion — a hard limiter on squat depth and landings. Measure toe-to-wall monthly. This IS the Section 4 daily dose — do not do it twice.","video":"https://www.youtube.com/results?search_query=Ankle+Knee-to-Wall+exercise+technique"}]},{"id":"PM","tab":"Evening","pre":"","heading":"Evening routine","meta":"about 15 min · 8 holds of 45–60 s","opt":false,"items":[{"t":"ex","id":"PM-26","n":"1","name":"Couch stretch","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Back foot up on a bench or against a wall. Squeeze the glute and tuck the tailbone before you come upright. Why: Undoes the day's single biggest shortening. Tip: The longest-standing tightness you have. Go to 2×90 s / side on squat days.","video":"https://www.youtube.com/results?search_query=Couch+stretch+exercise+technique"},{"t":"ex","id":"PM-27","n":"2","name":"Supine figure-4","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, ankle across the opposite knee, pull that knee towards the chest. Why: Glutes and deep rotators from a low-effort position.","video":"https://www.youtube.com/results?search_query=supine+figure+4+stretch"},{"t":"ex","id":"PM-28","n":"3","name":"Hamstring stretch with a strap","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, strap around the foot, leg raised with a soft knee and the other leg flat. Why: Hamstrings without loading the lower back.","video":"https://www.youtube.com/results?search_query=Hamstring+stretch+with+a+strap+exercise+technique"},{"t":"ex","id":"PM-29","n":"4","name":"90-90 hip static hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Front leg bent 90° across your body, back leg bent 90° out to the side. Sit tall, then hinge slowly forward over the front leg and hold. Swap sides. Why: Passive end-range hip external rotation (front leg) and internal rotation (back leg) — held long enough to change tissue length, not just access range. Tip: Passive counterpart to the morning switches and lift-offs.","video":"https://www.youtube.com/results?search_query=90+90+hip+stretch"},{"t":"ex","id":"PM-30","n":"5","name":"Child's pose with side reach","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Sit back onto the heels and reach the arms long, then walk them to each side. Why: Lats, flanks and lower-back decompression.","video":"https://www.youtube.com/results?search_query=Child%27s+pose+with+side+reach+exercise+technique"},{"t":"ex","id":"PM-31","n":"6","name":"Supine spinal twist","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"On your back, drop both bent knees to one side while the shoulders stay down. Why: Releases mid-back and lower-back tension.","video":"https://www.youtube.com/results?search_query=Supine+spinal+twist+exercise+technique"},{"t":"ex","id":"PM-32","n":"7","name":"Deep Squat Hold","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"60 s","kg":null}],"kind":"Mobility","focus":null,"note":"Sink into the deepest squat you can hold, heels down, elbows inside knees pushing out, breathe deeply. Why: Loaded end-range hip and ankle position — changes squat depth over 4-6 weeks better than passive stretching. The position both skiing and lifting borrow from. Tip: Also worth 45 s as part of a pre-training warm-up on the training sheet.","video":"https://www.youtube.com/results?search_query=Deep+Squat+Hold+exercise+technique"},{"t":"ex","id":"PM-34","n":"9","name":"Thoracic extension over a roller","unit":"Most evenings","rest":null,"tempo":null,"w":[{"s":"45–60 s","kg":null}],"kind":"Mobility","focus":null,"note":"Roller across the mid-back, support the head, extend back over it, move up 2 cm and repeat. Why: Mid-back extension, stiffened by both pressing and heavy rowing. Tip: Lead with this after an upper or pressing day.","video":"https://www.youtube.com/results?search_query=Thoracic+extension+over+a+roller+exercise+technique"}]},{"id":"KN","tab":"Knee & feet","pre":"","heading":"Knee, ankle and feet","meta":"about 15 min · 3 days a week · mobilise, strengthen, balance","opt":false,"items":[{"t":"sec","text":"Mobilise"},{"t":"ex","id":"KN-42","n":"1","name":"Knee-to-wall ankle mobilisation","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"2×10 / side","kg":null}],"kind":"Mobility","focus":null,"note":"Same position as the test. Drive the knee forward over the toes, heel glued down, then release. Move in and out of the range rather than holding. Why: Restores dorsiflexion so the foot no longer needs to splay to find depth. Tip: Baseline R 7 / L 8 cm (18 Oct 2026). Target +1-2 cm in 4 weeks; move the foot back about 0.5 cm per week. Same dose as the morning routine (Section 2), done once, in the morning.","video":"https://www.youtube.com/results?search_query=Knee-to-wall+ankle+mobilisation+exercise+technique"},{"t":"ex","id":"KN-43","n":"","name":"Calf stretch — bent knee, then straight knee","unit":"3× a week","rest":null,"tempo":"slow","w":[{"s":"45 s + 45 s / side","kg":null}],"kind":"Mobility","focus":null,"note":"Staggered stance against a wall, back heel down. First 45 s with the back knee BENT (soleus), then 45 s with the back leg straight (gastrocnemius). One merged calf block instead of two.","video":null},{"t":"ex","id":"KN-45","n":"4","name":"Hip internal rotation — prone or seated lift-off","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"2×8 / side","kg":null}],"kind":"Strength","focus":null,"note":"Seated at 90/90 or lying face down with the knee bent to 90°: turn the foot outward so the thigh rotates inward, hold 2 s at the end, lower slowly. Add a light band when it is easy. Why: Active internal rotation of the hip, the movement that turns the toes in and stops the knee collapsing inward when the feet point straight. Tip: Compare both sides with the prone hip rotation check above; the weaker side goes first.","video":"https://www.youtube.com/results?search_query=hip+internal+rotation+lift+off+prone+90+90"},{"t":"sec","text":"Strengthen"},{"t":"ex","id":"KN-49"," ance. Why: Activates the big toe and the arch (tripod foot) that control the foot angle and help the knee stay over the toes. Tip: Closer to the old short-foot drill, now on one leg, so the knee and the ankle work together.","video":"https://www.youtube.com/results?search_query=single+leg+stance+big+toe+raise+arch"},{"t":"ex","id":"KN-48","n":"7","name":"Pallof press on one leg — band","unit":"3× a week","rest":null,"tempo":null,"w":[{"s":"3×10 / side","kg":5}],"kind":"Strength","focus":null,"note":"Band at chest height beside you. Stand on one leg with a soft knee, press the band straight out and hold 2 s, return with control. Do not let the trunk or the knee twist. Why: Anti-rotation core plus single-leg hip and knee stability, in one exercise. Tip: Do both legs; start on the right (the knee that needs work). Band box: log the band resistance in kg (a light band is about 5, a medium about 10). Progression: step further from the anchor, then add a 2 s hold at full extension.","video":"https://www.youtube.com/results?search_query=single+leg+pallof+press+band"}]}]},"conditioning":{"id":"conditioning","name":"Conditioning · Fit 4 Racing","short":"CND","tag":"Fit 4 Racing (F4R)","knee":false,"version":"1","weeks":[{"label":"W1"},{"label":"W2"},{"label":"W3"},{"label":"W4"},{"label":"W5"},{"label":"W6"},{"label":"W7"},{"label":"W8"},{"label":"W9"},{"label":"W10"},{"label":"W11"}],"sessions":[{"id":"S1","tab":"Session 1","pre":"Session 1 · ","heading":"lower body + complex + metcon","meta":"","opt":false,"items":[{"t":"sec","text":"WARM-UP","_w":0},{"t":"ex","id":"C1-1-8","n":"1","name":"Skip / Cossack Squat / Dive Bomber Push-Up / Curtsey Squat circuit","unit":"","rest":null,"tempo":null,"w":[{"s":"3 rounds, not for time, easy pace. One round = Skip, Cossack Squat, Dive Bomber Push-Up and Curtsey Squat in this order (30s skip between movements).","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null},{"s":"","kg":null}, function beep(f,d,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||0.3;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;o.start(t);g.gain.setValueAtTime(v||0.3,t+d*0.75);g.gain.linearRampToValueAtTime(0.0001,t+d);o.stop(t+d+0.02)}catch(e){}}

const mmss=n=>{n=Math.max(0,Math.ceil(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};
function tmTypeFor(ex,wi,sw){
  if(sw)return null;
  if(/\bTEST\b/i.test(ex.name)&&/Touch-Jump|TJT/i.test(ex.name))return 'test';
  if(/Touch-Jump-Touch/i.test(ex.name)&&/×\s*\d+\s*$/.test(String(ex.w[wi].s)))return 'emom';
  if(/^s(\/side)?(\s*\(\+kg\))?$/i.test(ex.unit||'')&&holdSecs(ex,wi))return 'hold';
  return null;
}
function holdSecs(ex,wi){const o=S.ov[wi+'|'+ex.id];let v=o?parseInt(o.reps):NaN;if(isNaN(v)){const m=/×\s*(\d+)/.exec(String(ex.w[wi].s));v=m?+m[1]:NaN}return(v>=5&&v<=300)?v:null}
function startTimerFor(ex,wi){
  const t=tmTypeFor(ex,wi,null),nm=parseName(ex.name).title;
  if(t==='test')return tmStart(nm,[{l:'Get ready',d:10,start:false,cue:[3,2,1]},{l:'GO — max reps',d:120,cue:[60,30,10,3,2,1]}]);
  if(t==='emom'){const mins=+/×\s*(\d+)\s*$/.exec(String(ex.w[wi].s))[1];const b=tjtBase(wi);const segs=[{l:'Get ready',d:10,start:false,cue:[3,2,1]}];
    for(let i=1;i<=mins;i++)segs.push({l:'Minute '+i+' of '+mins,sub:b!=null?b+' reps, then rest':'Your target reps, then rest',d:60,cue:[3,2,1],tot:mins});
    return tmStart(nm+' · EMOM',segs)}
  if(t==='hold'){const d=holdSecs(ex,wi),sides=/side/i.test(ex.unit),n=nSets(ex,wi);const segs=[{l:'Get ready',d:5,start:false,cue:[3,2,1]}];
    if(sides){segs.push({l:'Side 1 · hold',d:d,cue:[3,2,1]});segs.push({l:'Switch sides',d:5,start:false,cue:[3,2,1]});segs.push({l:'Side 2 · hold',d:d,cue:[3,2,1]})}
    else segs.push({l:'Hold '+d+' s',d:d,cue:[3,2,1]});

}
function tmStart(label,segs){
  tmStop(true);let acc=0;segs.forEach(g=>{g.a=acc;acc+=g.d;g.b=acc});
  TM={label,segs,total:acc,t0:Date.now(),paused:0,pAt:null,i:-1,lr:null,done:false};

function tmStop(silent){if(TMI)clearInterval(TMI);TMI=null;TM=null;try{WL&&WL.release();WL=null}catch(e){}$('tmr').classList.remove('on','go','warn');$('tmr').innerHTML='';document.body.style.paddingBottom=''}

const dsF=(y,m,d)=>y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const localToday=()=>{const n=new Date();return dsF(n.getFullYear(),n.getMonth(),n.getDate())};
function sessLabel(P,wi,sid){const se=P.sessions.find(z=>z.id===sid);let label=P.single?((se&&se.tab)||sid):(((se&&se.pre)||('Day '+sid.replace(/\D/g,'')+' · ')).replace(/\s*·\s*$/,'')||sid);if(!P.single&&P.weeks[wi])label+=' · '+P.weeks[wi].label;return label}
function calEvents(){const m={};PORDER.forEach(id=>{if(id==='protocol')return;const st=getState(id),P=PROGS[id];const seen={};

  for(let d=new Date(from+'T12:00:00');;d.setDate(d.getDate()+1)){const ds=dsF(d.getFullYear(),d.getMonth(),d.getDate());if(ds>to)break;

const DC=p=>p==='cardio'?'#b0a47e':PCOL[p];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];

// ---- planner
const addD=(ds,n)=>{const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return dsF(d.getFullYear(),d.getMonth(),d.getDate())};
const monOf=ds=>addD(ds,-((new Date(ds+'T12:00:00').getDay()+6)%7));
const BTYPES={athletic:'Athletic 3+3',strength:'Strength',ski:'Ski 5 Week',ski8:'Ski Training 8 Weeks',cond:'Conditioning',summer:'Summer (2 sessions)',easy:'Easy week',trip:'Trip'};
const firstMonY=()=>{const m=monOf(CALY+'-01-01');return m<CALY+'-01-01'?addD(m,7):m};
function planWeeks(){loadCal();const cfg=CAL.cfg||{};const ath0=cfg['ath'+CALY]||addD(firstMonY(),7);
  const trips=CAL.trips.filter(t=>t.kind!=='other').map(t=>Object.assign({},t,{to:t.to||t.from}));
  const ws=[];for(let m=firstMonY();m<=CALY+'-12-31';m=addD(m,7))ws.push(m);
  const T={};
  const ovl=(m,t)=>{let n=0;for(let i=0;i<7;i++){const d=addD(m,i);if(d>=t.from&&d<=t.to)n++}return n};
  const allTrips=CAL.trips.map(t=>Object.assign({},t,{to:t.to||t.from}));
  ws.forEach(m=>{const hit=allTrips.filter(t=>ovl(m,t)>=3);if(hit.length)T[m]={t:'trip',name:hit[0].name||'Trip',maybe:hit[0].maybe}});
  allTrips.forEach(t=>{if(t.kind==='other')return;const days=Math.round((new Date(t.to)-new Date(t.from))/864e5)+1;if(days<3)return;const m=addD(monOf(t.to),7);if(ws.includes(m)&&!T[m])T[m]={t:'easy'}});
  trips.filter(t=>t.kind==='ski').sort((a,b)=>a.from.localeCompare(b.from)).forEach(sk=>{
    const m0=monOf(sk.from);let lim='0000';trips.forEach(t=>{if(t!==sk&&t.to<sk.from){const e=addD(monOf(t.to),14);if(e>lim)lim=e}});
    let st=addD(m0,-28);if(st<lim)st=lim;const lst=[];for(let m=st;m<=m0;m=addD(m,7))if(ws.includes(m)&&!T[m]&&!(CAL.noPre||[]).includes(sk.id))lst.push(m);
    lst.forEach((m,i)=>{T[m]={t:'ski',k:5-lst.length+i,name:sk.name,short:lst.length<5}})});
  (CAL.blocks||[]).forEach(b=>{const m0=monOf(b.from);for(let i=0;i<(+b.weeks||1);i++){const m=addD(m0,7*i);if(ws.includes(m))T[m]={t:b.type,k:i,manual:true}}});
  let ak=0,sk=0,ck=0;
  ws.forEach(m=>{if(T[m]){return}
    if(m<ath0)T[m]={t:'cond',k:ck++};
    else if(ak<16){T[m]={t:'athletic',k:ak++}}
    else if(m.slice(5,7)==='08')T[m]={t:'summer',k:ck++};
    else T[m]={t:'strength',k:sk++}});
  let run=0;const out=ws.map(m=>{const w=Object.assign({mon:m},T[m]);if(w.t==='trip'||w.t==='easy')run++;else{if(run>=3)w.retest=true;run=0}if(w.t==='strength'&&(w.k||0)%8===4)w.deload=true;return w});return out}
function weekSess(w){const k=w.k||0;
  if(w.t==='athletic'){const o=k%2?['D','E','F']:['A','B','C'],r=Math.floor(k/2);return [[0,'athletic',o[0],r],[2,'athletic',o[1],r],[4,'athletic',o[2],r],[1,'cardio','Z2',0],[3,'cardio','VO2',0]]}
  if(w.t==='strength'){const r=k%8;return [[0,'strength','A',r],[2,'strength','B',r],[4,'strength','C',r],[1,'cardio','TH',0],[3,'cardio','VO2',0]]}

function loggedIn(p,wi,sid,mon){const st=getState(p),P=PROGS[p],k=wi+'|'+sid;let hit=false;

function wkText(w){if(!w)return '';const k=w.k||0;

function planBlocks(){planItems();const out=[];(PLANC.weeks||[]).forEach(w=>{const l=out[out.length-1];if(l&&l.t===w.t&&l.name===w.name&&!w.manual===!l.manual){l.end=addD(w.mon,6);l.k1=w.k}else out.push({t:w.t,name:w.name,manual:w.manual,start:w.mon,end:addD(w.mon,6),k0:w.k,k1:w.k})});
  return out.map(b=>{let tx=BTYPES[b.t]||b.t;if(b.t==='athletic')tx+=' R'+(Math.floor(b.k0/2)+1)+(Math.floor(b.k1/2)!==Math.floor(b.k0/2)?'–R'+(Math.floor(b.k1/2)+1):'');if(b.t==='ski')tx+=' (weeks '+(b.k0+1)+'–'+(b.k1+1)+' of 5)';if(b.t==='ski8')tx+=' (weeks '+(b.k0+1)+'–'+(b.k1+1)+' of 8)';if(b.t==='trip'&&b.name)tx+=': '+b.name;return {tx,start:b.start,end:b.end,t:b.t,manual:b.manual}})}

function icsText(){loadCal();const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Dani Training//EN','CALSCALE:GREGORIAN'];const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const D=d=>d.replace(/-/g,'');const ev=(uid,d1,d2,sum,desc)=>{L.push('BEGIN:VEVENT','UID:'+uid+'@dani-training','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+D(d1),'DTEND;VALUE=DATE:'+D(addD(d2,1)),'SUMMARY:'+sum.replace(/[,;]/g,' '),...(desc?['DESCRIPTION:'+desc.replace(/[,;\n]/g,' ')]:[]),'END:VEVENT')};
  const PL=planItems();Object.keys(PL).sort().forEach(d=>PL[d].forEach(x=>ev(x.key.replace(/\|/g,'-'),d,d,x.name+' - '+x.label,x.done?'done':'')));
  CAL.trips.forEach(t=>ev('trip-'+t.id,t.from,t.to||t.from,(t.kind==='other'?'Travel Workout trip':'Sport trip')+': '+(t.name||'')+(t.maybe?' (maybe)':'')));
  Object.keys(CAL.days).sort().forEach(d=>{if(CAL.days[d].tango)ev('tango-'+d,d,d,'Tango'+(CAL.days[d].note?' - '+CAL.days[d].note:''))});
  L.push('END:VCALENDAR');return L.join('\r\n')}
function exportIcs(){const txt=icsText();try{const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));const a=document.createElement('a');a.href=u;a.download='training-'+CALY+'.ics';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500)}catch(e){}}

function syncPayload(){

        const se=PLAN.sessions.find(z=>z.id===sid),di=PLAN.sessions.findIndex(z=>z.id===sid)+1;

        const base=[d,PLAN.name,w.label,sessLabel(PLAN,wi,sid)],tail=[min,h.pain==null?'':h.pain,h.notes||'',rd];
        if(h.date===d&&h.items&&h.items.length)h.items.forEach(it=>log.push(base.concat([it.n,it.spec,it.done,it.of,it.kg||''],tail)));
        else log.push(base.concat(['(session total)','',dd.done||'',dd.of||'',''],tail))})})})});
  log.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);
  // one row per day: training, cardio, mobility, tango, trip, readiness, minutes, comment
  const trip={};CAL.trips.forEach(t=>{let x=new Date(t.from+'T12:00:00'),e=new Date((t.to||t.from)+'T12:00:00'),n=0;while(x<=e&&n++<120){const ds=dsF(x.getFullYear(),x.getMonth(),x.getDate());trip[ds]=(trip[ds]?trip[ds]+' + ':'')+(t.name||'Trip')+' ('+(t.kind||'trip')+(t.maybe?', maybe':'')+')';x.setDate(x.getDate()+1)}});

      const tr=en.filter(z=>['ski','ski8','strength','athletic','conditioning','nogym'].includes(z.id)),ca=en.filter(z=>z.id==='cardio');
      const mo=[];en.filter(z=>z.id==='mobility').forEach(z=>{if(!mo.includes(z.lab))mo.push(z.lab)});if(c.am&&!mo.includes('Morning'))mo.push('Morning');if(c.pm&&!mo.includes('Evening'))mo.push('Evening');
      const cm=ca.reduce((a,z)=>a+z.min,0);

async function syncNow(manual){
  if(!G.syncUrl||SYNC_BUSY)return;
  let body,hh;try{body=JSON.stringify(syncPayload());hh=h32(body)}catch(e){setSyncMsg('Could not read the log.');return}
  if(!manual&&hh===G.syncHash)return;
  if(navigator.onLine===false){setSyncMsg('Offline. It will be sent when you are back online.');return}
  SYNC_BUSY=true;const hd={'Content-Type':'text/plain;charset=utf-8'};
  try{
    let note='';
    try{const r=await fetch(G.syncUrl,{method:'POST',headers:hd,body});const j=await r.json();if(!j||!j.ok)throw new Error((j&&j.error)||'refused');note=(j.rows!=null?j.rows+' rows':'ok')}
    catch(e){if(e&&e.name!=='TypeError')throw e;await fetch(G.syncUrl,{method:'POST',mode:'no-cors',headers:hd,body});note='sent, not confirmed'}
    G.syncHash=hh;G.syncAt=Date.now();const t=new Date();setSyncMsg('Sent '+t.toLocaleDateString()+' '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+' · '+note)
  }catch(e){setSyncMsg('Could not send: '+(e&&e.message||e)+'. It will try again.')}
  finally{SYNC_BUSY=false}
}

  async set(k,v){const d=await this.db();return new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};

  const blockOf=t=>{const l=els();return t&&t.closest?l.find(x=>x.e.contains(t)):null};
  const down=e=>{const b=blockOf(e.target);if(!b||document.body.dataset.view!=='home')return;const p=xy(e);sx=p.x;sy=p.y;moved=false;clearTimeout(tmr);tmr=setTimeout(()=>{drag={b,y0:p.y,hit:null};b.e.classList.add('bdrag');if(navigator.vibrate)try{navigator.vibrate(15)}catch(x){}},500)};

    if(e.cancelable)e.preventDefault();moved=true;drag.b.e.style.transform='translateY('+(p.y-drag.y0)+'px) scale(1.02)';
    let hit=null;els().forEach(x=>{if(x.id===drag.b.id)return;const r=x.e.getBoundingClientRect();x.e.classList.remove('bswap');if(p.y>=r.top&&p.y<=r.bottom)hit=x});if(hit)hit.e.classList.add('bswap');drag.hit=hit};
  const up=e=>{clearTimeout(tmr);if(!drag)return;const d=drag;drag=null;d.b.e.classList.remove('bdrag');d.b.e.style.transform='';els().forEach(x=>x.e.classList.remove('bswap'));

  m.addEventListener('touchstart',down,{passive:true});m.addEventListener('touchmove',move,{passive:false});m.addEventListener('touchend',up);m.addEventListener('touchcancel',up);

  m.addEventListener('click',e=>{if(ig){e.stopImmediatePropagation();e.preventDefault()}},true)}
